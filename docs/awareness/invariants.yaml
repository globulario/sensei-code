invariants:
  - id: sensei_code.assisted_context.source_is_sensei
    title: Assisted architectural context must come from Sensei and preserve its provenance
    severity: critical
    status: active
    repo: github.com/globulario/sensei-code
    domain: repo
    protects:
      files:
        - internal/assist/
        - internal/assist/packet.go
        - internal/assist/handoff.go
        - cmd/sensei-code/assist.go
    required_tests:
      - internal/assist/packet_test.go:TestBuildUsesSenseiAndCarriesProvenance
      - internal/assist/packet_test.go:TestBuildFailsClosedWhenRequiredSenseiEvidenceIsUnavailable
      - internal/assist/packet_test.go:TestBuildFailsClosedWhenSenseiAnswersWithoutEvidence

  - id: sensei_code.assisted_context.never_claims_admission
    title: Assisted context and handoff packets must never claim governed admission
    severity: critical
    status: active
    repo: github.com/globulario/sensei-code
    domain: repo
    protects:
      files:
        - internal/assist/
        - internal/assist/packet.go
        - internal/assist/handoff.go
        - cmd/sensei-code/assist.go
        - .github/workflows/
    required_tests:
      - internal/assist/packet_test.go:TestHandoffBindsToExactContextAndCannotClaimAdmission

  - id: sensei_code.handoff.bound_to_exact_context
    title: Cross-agent handoff must remain bound to the exact task context it continues
    severity: high
    status: active
    repo: github.com/globulario/sensei-code
    domain: repo
    protects:
      files:
        - internal/assist/handoff.go
        - cmd/sensei-code/assist.go
    required_tests:
      - internal/assist/packet_test.go:TestHandoffBindsToExactContextAndCannotClaimAdmission

  - id: sensei_code.sensei_boundary.refusal_carries_its_reason
    title: A refused or unavailable Sensei surface must carry its reason
    severity: high
    status: active
    repo: github.com/globulario/sensei-code
    domain: repo
    description: "When Sensei refuses a tool call or its server cannot be reached, Sensei Code must propagate the reason Sensei gave. Discarding the tool result text or the server stderr turns a governed refusal into an indistinguishable transport fault and defeats law 8."
    protects:
      files:
        - internal/sensei/mcp.go
    required_tests:
      - internal/sensei/mcp_test.go:TestRefusalReasonIsPreserved
      - internal/sensei/mcp_test.go:TestStderrTailKeepsBoundedSuffix
    contract: Sensei Code fails closed on missing Sensei evidence and names the cause

  - id: sensei_code.provider.credentials_remain_provider_owned
    title: Provider authentication credentials must remain owned by the native provider client
    severity: critical
    status: active
    repo: github.com/globulario/sensei-code
    domain: repo
    protects:
      files:
        - internal/provider/
        - internal/provider/provider.go
        - internal/provider/codex_appserver.go
        - cmd/sensei-code/providers.go
        - internal/tui/model.go
    required_tests:
      - internal/provider/provider_test.go:TestProviderStatusHasNoCredentialFields

  - id: sensei_code.provider.unknown_auth_is_not_connected
    title: Unknown provider authentication state must never be rendered as authenticated
    severity: critical
    status: active
    repo: github.com/globulario/sensei-code
    domain: repo
    protects:
      files:
        - internal/provider/
        - internal/provider/provider.go
        - internal/provider/codex_appserver.go
        - internal/doctor/
        - internal/doctor/doctor.go
    required_tests:
      - internal/provider/provider_test.go:TestFormatStatusPreservesUnknownAuth
      - internal/doctor/doctor_test.go:TestWarningsDoNotMasqueradeAsPassButDoNotBlockReadiness

  - id: sensei_code.workflow.execution_is_authorized_once_at_run
    title: /run authorizes the task, and the authority router owns every later interruption
    severity: critical
    status: active
    repo: github.com/globulario/sensei-code
    domain: repo
    description: "Typing /run authorizes Sensei Code to undertake that task within its configured capabilities. The bounded plan is shown as information, never as a gate. After that point only two things may interrupt the human: a Level-3 authority condition the router itself produced, and the publication decision. A mandatory step that interrupts without producing an authority decision is ceremony, and must not exist. This replaces sensei_code.workflow.plan_is_approved_before_work_starts, whose second approval produced no evidence, made no decision the router had not already made, and recorded nothing durable."
    protects:
      files:
        - internal/workflow/
        - internal/workflow/engine.go
    required_tests:
      - internal/workflow/engine_test.go:TestRunDoesNotAskForRoutinePlanApproval
      - internal/workflow/engine_test.go:TestOnlyTheAuthorityRouterCreatesALevel3Stop
      - internal/workflow/engine_test.go:TestAGovernedRunCanBeStopped
      - internal/workflow/engine_test.go:TestDecisionRecordNamesTheRealAuthorityOwner
      - internal/workflow/authority_test.go:TestPlanRevisionInsideTheCertifiedEnvelopeDoesNotInterrupt
      - internal/session/interrupted_test.go:TestStoppedTaskRemainsResumable

  - id: sensei_code.conversation.investigation_reads_and_standing_context_is_derived
    title: A conversational turn may read the repository and never change it, and its standing context is derived rather than stored
    severity: high
    status: active
    repo: github.com/globulario/sensei-code
    domain: repo
    description: "The architect is a strong investigator and a non-mutating one, and non-mutating is a property of the code rather than a sentence in a prompt: investigation runs a closed allowlist of read-only git subcommands and refuses everything else by type. What it cannot read it states, because a blank field reads as nothing-to-report. Standing project context is derived from the session record every turn rather than maintained as a summary: a maintained summary is a second store of architectural claims that wins by being convenient the moment it disagrees with Sensei. It carries references, never copied authority, and it cannot make an unpromoted proposal canonical. Assisted mode does not so much as reference governed-artifact machinery."
    protects:
      files:
        - internal/investigate/
        - internal/project/
        - internal/workflow/assisted.go
    required_tests:
      - internal/investigate/investigate_test.go:TestOnlyReadOnlySubcommandsAreReachable
      - internal/investigate/investigate_test.go:TestUnreadableEvidenceIsStatedNotBlank
      - internal/project/project_test.go:TestTheSummaryIsDerivedAndHoldsReferencesNotClaims
      - internal/project/project_test.go:TestBoundsAreDisclosed
      - internal/workflow/mode_test.go:TestAssistedWorkflowCreatesNoGovernedArtifacts

  - id: sensei_code.retrieval.selection_routes_a_query_and_never_creates_a_claim
    title: Retrieval is selected by the question, bounded out loud, and an empty answer is reported rather than widened
    severity: high
    status: active
    repo: github.com/globulario/sensei-code
    domain: repo
    description: "A conversational turn selects evidence from what the question names rather than injecting the same broad reads every time. Reading the question routes a lookup and decides nothing: if the graph has never heard of the target, the turn reports that it was asked and had nothing, and does not widen the query until something comes back or fall through to inference. Only Sensei's typed read surfaces are reachable, never a free-form query and never a writing tool. Every bound is stated, because a turn that consulted four sources out of nine reads exactly like complete coverage to whoever trusts the answer."
    protects:
      files:
        - internal/retrieval/
        - internal/workflow/assisted.go
    required_tests:
      - internal/retrieval/retrieval_test.go:TestSelectionRoutesLookupsFromWhatTheQuestionNames
      - internal/retrieval/retrieval_test.go:TestAnEmptyAnswerIsReportedRatherThanWidened
      - internal/retrieval/retrieval_test.go:TestTheBudgetIsBoundedAndSaysWhatItDropped
      - internal/retrieval/retrieval_test.go:TestOnlyTypedReadSurfacesAreReachable

  - id: sensei_code.conversation.continuity_is_identity_never_memory
    title: A conversation that cannot be resumed says so, and remembered dialogue never becomes evidence
    severity: high
    status: active
    repo: github.com/globulario/sensei-code
    domain: repo
    description: "The architect process starts fresh every turn, so continuity has to be recorded — but what is recorded is identity, not content. A stored provider handle is a continuity hint and never an authority claim, and the local record carries no field that could hold a decision, because a second weaker governance store disagrees with Sensei invisibly. When the thread cannot be resumed the turn states the loss specifically and reconstructs from the session record and Sensei, rather than answering as though the conversation survived. Every turn can show which sources it consulted and in what state, and a source that failed appears as a source that failed."
    protects:
      files:
        - internal/continuity/
        - internal/assist/
        - internal/workflow/assisted.go
    required_tests:
      - internal/continuity/continuity_test.go:TestALostThreadIsStatedAndSpecific
      - internal/continuity/continuity_test.go:TestTheRecordCannotCarryGovernanceContent
      - internal/assist/packet_test.go:TestTheDrawerShowsFailedSourcesRatherThanOmittingThem

  - id: sensei_code.admission.the_chain_is_senseis_and_only_it_establishes_admission
    title: Sensei Code composes the canonical admission chain and never decides admission itself
    severity: critical
    status: active
    repo: github.com/globulario/sensei-code
    domain: repo
    description: "Admission evaluates a convergence bundle, which is Sensei's synthesis output; composing something bundle-shaped locally would produce records that satisfy the schema and mean nothing. So Sensei Code builds argv for synthesis-admit, admit-change, synthesis-apply and verify-admission, wires each step to what the previous one wrote, and reads exit codes — it decides nothing. Only admit-change establishes admission: reviewer acceptance does not, a passing diff audit does not, and a chain that ran without error does not. Admission is permission to attempt rather than proof of correctness, and scope compliance is not correctness certification. A refusal is distinguished from a broken toolchain, and an exit code this build does not recognise is reported as unrecognised rather than mapped onto an existing meaning."
    protects:
      files:
        - internal/admission/
    required_tests:
      - internal/admission/admission_test.go:TestTheChainWiresEachStepToWhatThePreviousOneWrote
      - internal/admission/admission_test.go:TestOnlyTheDecidingStepEstablishesAdmission
      - internal/admission/admission_test.go:TestRefusalAndBreakageAreDistinguished
      - internal/admission/admission_test.go:TestMissingInputsAreRefusedRatherThanGuessed

  - id: sensei_code.candidate.disposition_is_decided_and_evidence_outlives_removal
    title: A candidate is kept or removed by decision, and its evidence is recorded before anything is removed
    severity: critical
    status: active
    repo: github.com/globulario/sensei-code
    domain: repo
    description: "Every governed task creates a worktree and a branch, and a candidate nobody resolved means nothing in particular — which turns recovery from disk into archaeology and erodes the value of an exact persisted base. So each candidate reaches a stated disposition from a closed vocabulary, retention carries the reason that kept it, and nothing is removed before its base, diff and audit evidence are written down. Automatic removal is reached only by a candidate whose own recorded evidence says it holds no work: deleting on exit would perform the deletion half of a publication decision the system correctly refuses to make."
    protects:
      files:
        - internal/candidate/
        - internal/candidate/disposition.go
        - internal/workflow/engine.go
    required_tests:
      - internal/candidate/disposition_test.go:TestRemovalRequiresEvidenceThatOutlivesTheCandidate
      - internal/candidate/disposition_test.go:TestRetentionStatesItsReason
      - internal/candidate/disposition_test.go:TestDispositionVocabularyIsClosed
      - internal/workflow/engine_test.go:TestOnlyAnEmptyCandidateIsRemovedAutomatically

  - id: sensei_code.authority.only_an_explicit_answer_satisfies_a_boundary
    title: The human may stop computation at any time, but only an explicit authority decision can satisfy an authority boundary
    severity: critical
    status: active
    repo: github.com/globulario/sensei-code
    domain: repo
    description: "Esc during ordinary execution stops the run. Esc at a Level-3 rendezvous defers the question instead: once the router has established that a decision is a person's, there is no architect-authorized continuation left, so a keystroke must not be able to mean no. A deferred question is recorded whole and resumed by asking it again verbatim — never by re-running the router, which could produce a different question from a graph that moved and satisfy a boundary nobody was asked about. Ctrl+C stays an operating-system escape hatch and is not part of the governance protocol."
    protects:
      files:
        - internal/workflow/
        - internal/workflow/engine.go
        - internal/session/store.go
    required_tests:
      - internal/workflow/engine_test.go:TestDeferredAuthorityIsItsOwnTransition
      - internal/workflow/engine_test.go:TestDeferralCallsNoOneAfterwards
      - internal/workflow/engine_test.go:TestResumeRestoresTheDeferredQuestionWithoutRerouting
      - internal/workflow/engine_test.go:TestOnlyAChosenOptionSatisfiesAnAuthorityBoundary
      - internal/session/interrupted_test.go:TestDeferredAuthorityIsResumableAndCarriesItsQuestion

  - id: sensei_code.workflow.context_never_widens_worker_scope
    title: Shared context explains why a change was asked for and never enlarges what may be changed
    severity: critical
    status: active
    repo: github.com/globulario/sensei-code
    domain: repo
    description: "Workers and the reviewer receive the conversation, the architect's intent and Sensei's evidence. That context must not become a side channel around the approved plan: a worker asked for work the plan does not cover reports it and leaves it undone, and the reviewer's standard of proof is unchanged by it."
    protects:
      files:
        - internal/workflow/
        - internal/workflow/engine.go
    required_tests:
      - internal/workflow/engine_test.go:TestImplementationPromptCarriesContextWithoutWideningScope
      - internal/workflow/engine_test.go:TestReviewPromptCarriesContextWithoutLoweringTheBar
      - internal/workflow/engine_test.go:TestGuidanceReachesTheWorkerWithoutEnlargingThePlan

  - id: sensei_code.publication.never_merges
    title: Sensei Code may open a pull request and may never merge one
    severity: critical
    status: active
    repo: github.com/globulario/sensei-code
    domain: repo
    description: "Publication is human-owned. Sensei's own merge-check verifies that a pull request is merge-authorized and never merges it, and Sensei Code holds the same line. Publication is gated twice, by the configured capability and by the human at the moment, and a pull request is never an admission."
    protects:
      files:
        - internal/publish/
        - internal/publish/publish.go
    required_tests:
      - internal/publish/publish_test.go:TestPullRequestArgsNeverMerge
      - internal/publish/publish_test.go:TestPublicationRefusedWithoutTheCapability
      - internal/publish/publish_test.go:TestBodyCarriesTheReportAndRefusesToClaimAdmission

  - id: sensei_code.capability.declared_push_refusal_is_enforced
    title: A capability the configuration withholds is enforced, not merely requested of the worker
    severity: critical
    status: active
    repo: github.com/globulario/sensei-code
    domain: repo
    description: "Capability flags read as guarantees. When push is not granted a pre-push hook is installed and the worker's git is pointed at it, so git refuses the push rather than the worker being asked not to. The guard lives outside the candidate so it cannot be committed into the change it protects."
    protects:
      files:
        - internal/gitguard/
        - internal/gitguard/gitguard.go
    required_tests:
      - internal/gitguard/gitguard_test.go:TestGuardActuallyRefusesAPush
      - internal/gitguard/gitguard_test.go:TestGuardDoesNotLiveInTheDirectoryItProtects

  - id: sensei_code.evidence.counts_carry_their_provenance
    title: A reported figure states whether it is an exact total, a lower bound, or unpublished
    severity: high
    status: active
    repo: github.com/globulario/sensei-code
    domain: repo
    description: "Sensei publishes exact totals for some classes and none for others, and a bounded query returns at most what it asked for. Presenting those alike is how a report starts lying, as when 144 invariants read as authored governance while 138 were an installed pack. Absence is reported as unmeasured, never as a reassuring zero."
    protects:
      files:
        - internal/architect/
        - internal/architect/report.go
    required_tests:
      - internal/architect/report_test.go:TestInstalledPackIsNotCreditedAsAuthoredGovernance
      - internal/architect/report_test.go:TestClassesWithNoPublishedTotalAreNotShownAsZero
      - internal/architect/report_test.go:TestReportRefusesToPresentCountsAsAnAssessment

  - id: sensei_code.report.states_what_it_does_not_establish
    title: Every report ends with the claims it is not entitled to make
    severity: high
    status: active
    repo: github.com/globulario/sensei-code
    domain: repo
    description: "A change summary reads as a completion claim unless it says otherwise. Reports state that admission was not requested, that reviewer acceptance and passing tests are not proof, and that a class Sensei holds nothing for is knowledge it was never given."
    protects:
      files:
        - internal/report/
        - internal/report/report.go
    required_tests:
      - internal/report/report_test.go:TestReportNeverClaimsAdmissionOrCorrectness
      - internal/report/report_test.go:TestReportFlagsMissingTestsAndAbsentAudit

  - id: sensei_code.learning.never_promotes_its_own_lessons
    title: Recorded knowledge enters a review queue and never the live graph
    severity: critical
    status: active
    repo: github.com/globulario/sensei-code
    domain: repo
    description: "A tool that could promote its own lessons into governance would let one bad afternoon become a permanent rule. Decisions and scars are appended for human review, a decision Sensei would refuse is reported rather than padded to pass, and recording never republishes the graph."
    protects:
      files:
        - internal/decision/
        - internal/decision/record.go
    required_tests:
      - internal/decision/record_test.go:TestUnlinkedDecisionIsRefusedRatherThanPadded
      - internal/decision/record_test.go:TestSourceFilesAloneDoNotSatisfyContractFirst
      - internal/decision/record_test.go:TestArgsNeverRebuildTheGraph

  - id: sensei_code.candidate.reviewer_sees_every_changed_file
    title: The reviewer judges the whole candidate, including files the worker created
    severity: critical
    status: active
    repo: github.com/globulario/sensei-code
    domain: repo
    description: "git diff reports tracked modifications only, so a created file was absent from the candidate diff and the reviewer judged a change with its new files invisible. It rejected real work six times for omitting a test that was on disk. Candidates diff with intent-to-add so created files are visible."
    protects:
      files:
        - internal/gitx/
        - internal/gitx/git.go
    required_tests:
      - internal/gitx/git_test.go:TestCandidateDiffIncludesFilesTheWorkerCreated

  - id: sensei_code.mcp.configuration_only_adds_what_is_missing
    title: Repairing an agent's Sensei access never rewrites configuration the user wrote
    severity: high
    status: active
    repo: github.com/globulario/sensei-code
    domain: repo
    description: "Silently rewriting an agent's own configuration replaces a deliberate choice with a guess. Missing entries are added and existing ones are left exactly as written. A registered server whose tools the agent cannot call is reported as partial, because an unverified route to Sensei is not a route to Sensei."
    protects:
      files:
        - internal/mcpconfig/
        - internal/mcpconfig/mcpconfig.go
    required_tests:
      - internal/mcpconfig/mcpconfig_test.go:TestConfigureLeavesAnExistingEntryAlone
      - internal/mcpconfig/mcpconfig_test.go:TestMissingCodexToolsFindsBlockedEvidenceTools

  - id: sensei_code.outcome.reporting_never_alters_the_result
    title: Recording what happened never changes what happened
    severity: high
    status: active
    repo: github.com/globulario/sensei-code
    domain: repo
    description: "A task that succeeded did succeed whether or not the fact could be filed, so a reporting failure is surfaced and never converts a successful task into a failed one. A refused record is surfaced rather than counted as recorded, and reporting stays off until a project and domain are named so this repository's outcomes are never filed against another's principles."
    protects:
      files:
        - internal/behavioral/
        - internal/behavioral/behavioral.go
    required_tests:
      - internal/behavioral/behavioral_test.go:TestRecordIsSkippedUntilScopedDeliberately
      - internal/behavioral/behavioral_test.go:TestRecordSurfacesARefusalInsteadOfReportingSuccess

  - id: sensei_code.resume.never_skips_a_human_decision
    title: A task still awaiting approval is never resumed
    severity: critical
    status: active
    repo: github.com/globulario/sensei-code
    domain: repo
    description: "Resuming re-enters implementation only, so a task whose plan was never approved has no candidate to continue and resuming it would skip a decision the human never made. Sensei evidence is re-read on resume rather than restored from the log, because the graph may have moved while the process was gone."
    protects:
      files:
        - internal/session/
        - internal/session/store.go
    required_tests:
      - internal/session/interrupted_test.go:TestUnapprovedTaskIsNotResumable
      - internal/session/interrupted_test.go:TestFinishedTasksAreNotResumable

  - id: sensei_code.command.unknown_input_is_never_run_as_a_task
    title: An unrecognised command is answered, never handed to the architect as work
    severity: high
    status: active
    repo: github.com/globulario/sensei-code
    domain: repo
    description: "A mistyped command passed through as task text reaches the architect as a feature request. Unknown commands are named as unknown with the closest suggestion, and the command catalogue generates its own help so the listed surface cannot drift from the dispatched one."
    protects:
      files:
        - internal/command/
        - internal/command/command.go
    required_tests:
      - internal/command/command_test.go:TestUnknownCommandIsNotTreatedAsATask
      - internal/command/command_test.go:TestGroupsCoverEveryCommand

  - id: sensei_code.roles.adversarial_roles_inherit_nothing_and_bind_to_a_revision
    title: An adversarial role inherits nothing from the work it judges, and its verdict is bound to the revision it read
    severity: critical
    status: active
    description: Asking a second model whether a change is correct produces a second opinion only if it did not already read the case for the change. The reviewer here was reached through AskFork, which hands it the architect's whole conversation, and its verdict carried no identity for the bytes it read. So a review was correlated with what it judged and could be carried onto a later revision, and neither fact was visible in the transcript. An adversarial role therefore opens a provider session that inherits nothing, cannot be the provider that implemented the candidate, and produces a verdict bound to the exact candidate revision, refused as superseded when the worker edits it.
    protects:
      files:
        - internal/roles/roles.go
        - internal/roles/verdict.go
        - internal/agent/agent.go
        - internal/workflow/adversarial.go
    required_tests:
      - internal/agent/agent_session_test.go:TestAnAdversarialRoleAlwaysStartsFresh
      - internal/roles/roles_test.go:TestARevisionInvalidatesTheVerdictBoundToThePreviousOne
      - internal/roles/roles_test.go:TestAWorkerCannotReviewItsOwnCandidate
      - internal/workflow/adversarial_test.go:TestAReviewRunsInAnIndependentSession
    contract: an independent review is independent of the session, the author, and the revision it did not read
