decisions:
  - id: decision.sensei_code.add_a_read_only_report_tui_command_backed_by_sensei_mcp_pres
    title: Add a read-only /report TUI command backed by Sensei MCP, preserving explicit refusal diagnostics and provider-owned credentials.
    status: accepted
    architectural_plane: intended
    rationale: 'add a /report command to the TUI that shows an architecture report for this repository: query Sensei through MCP for counts of invariants, failure modes, forbidden fixes, contracts, decisions, design patterns and implementation patterns; render them as horizontal bar charts with lipgloss; list the concrete facts as text; and end with a section naming what is missing or should be improved based on those numbers'
    context: Accepted by the human in an interactive Sensei Code session.
    consequences: The TUI gains a local, read-only architecture snapshot. It will state Sensei authority and uncertainty honestly; no credentials are read, stored, or displayed, and an MCP refusal remains distinguishable from zero facts.
    related_invariants:
      - invariant:sensei_code.provider.credentials_remain_provider_owned
      - invariant:sensei_code.sensei_boundary.refusal_carries_its_reason
    source_files:
      - internal/sensei/report.go
      - internal/sensei/report_test.go
      - internal/tui/model.go
      - internal/tui/layout_test.go
  - id: decision.sensei_code.add_a_bounded_read_only_report_tui_view_backed_by_live_domai
    title: Add a bounded, read-only `/report` TUI view backed by live, domain-scoped Sensei MCP evidence.
    status: accepted
    architectural_plane: intended
    rationale: 'add a /report command to the TUI that shows an architecture report for this repository: query Sensei through MCP for counts of invariants, failure modes, forbidden fixes, contracts, decisions, design patterns and implementation patterns; render them as horizontal bar charts with lipgloss; list the concrete facts as text; and end with a section naming what is missing or should be improved based on those numbers'
    context: Accepted by the human in an interactive Sensei Code session.
    consequences: Operators can inspect live Sensei architecture coverage without starting an implementation workflow. Current evidence shows 144 invariants, 3 failure modes, and 2 forbidden fixes, while contracts, decisions, design patterns, and implementation patterns currently return zero rows; the report will surface those gaps explicitly rather than treating them as healthy coverage.
    related_invariants:
      - invariant:sensei_code.provider.credentials_remain_provider_owned
    source_files:
      - internal/tui/model.go
      - internal/tui/report.go
      - internal/tui/report_test.go
      - internal/tui/layout_test.go
