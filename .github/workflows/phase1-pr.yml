name: Phase 1 PR

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  go:
    name: Go verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: Resolve canonical module metadata
        run: go mod tidy
      - name: Preserve canonical module metadata
        uses: actions/upload-artifact@v4
        with:
          name: phase1-go-module-metadata
          path: |
            go.mod
            go.sum
          if-no-files-found: error
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/sensei-code

  sensei:
    name: Sensei architectural gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce repository invariants
        id: sensei-gate
        continue-on-error: true
        uses: globulario/sensei-action@main
        with:
          mode: enforce
          sarif: 'false'
      - name: Preserve Sensei gate evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: sensei-gate-output
          path: ${{ runner.temp }}/gate.out
          if-no-files-found: warn
      - name: Preserve fail-closed verdict
        if: ${{ steps.sensei-gate.outcome != 'success' }}
        run: |
          echo '::error::Sensei enforcing gate did not prove this diff.'
          exit 1

  codex-review:
    name: Codex review with Sensei context
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: Resolve module metadata for the context helper
        run: go mod tidy

      - name: Start Sensei and compile governed context
        uses: globulario/sensei-action@main
        with:
          mode: advisory
          sarif: 'false'

      - name: Build assisted Sensei context packet
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          FILES="$(git diff --name-only "origin/${BASE_REF}...HEAD" | paste -sd, -)"
          go run ./cmd/sensei-code context \
            --task "Review PR #${PR_NUMBER}: ${PR_TITLE}" \
            --task-id "github-pr-${PR_NUMBER}" \
            --files "$FILES" \
            --out "$RUNNER_TEMP/sensei-context.json"

      - name: Prepare bounded review prompt
        if: ${{ env.OPENAI_API_KEY != '' }}
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          {
            echo "You are the independent reviewer for Sensei Code PR #${PR_NUMBER}: ${PR_TITLE}."
            echo
            echo "The Sensei context packet below is governed evidence. Treat it as context, not as permission to invent claims that are absent from it."
            echo "This is assisted-mode review. Reviewer acceptance is NOT Sensei admission."
            echo
            echo "## Sensei context packet"
            cat "$RUNNER_TEMP/sensei-context.json"
            echo
            echo "## Pull request diff"
            git diff --no-ext-diff "origin/${BASE_REF}...HEAD"
            echo
            echo "Review whether the diff satisfies the stated task and the Sensei evidence. Identify correctness, architectural, test-evidence, authority, or provenance defects. Do not modify files. Return concise Markdown with a verdict of APPROVE or REQUEST_CHANGES and concrete findings."
          } > "$RUNNER_TEMP/codex-review-prompt.md"

      - name: Run Codex reviewer
        if: ${{ env.OPENAI_API_KEY != '' }}
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: ${{ runner.temp }}/codex-review-prompt.md
          output-file: ${{ runner.temp }}/codex-review.md
          sandbox: read-only
          safety-strategy: read-only

      - name: Publish Codex review
        if: ${{ env.OPENAI_API_KEY != '' }}
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/codex-review.md"

      - name: Record disabled hosted reviewer
        if: ${{ env.OPENAI_API_KEY == '' }}
        run: echo 'Codex review skipped because OPENAI_API_KEY is not configured. Go and Sensei gates still run.' >> "$GITHUB_STEP_SUMMARY"
