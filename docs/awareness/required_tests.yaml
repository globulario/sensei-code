required_tests:
  - id: internal/doctor/doctor_test.go:TestAuthenticationAloneIsNotReadiness
    title: Authentication alone is not readiness
    protects:
      invariants:
        - sensei_code.provider.authentication_is_not_readiness
      files:
        - internal/doctor/doctor.go
  - id: internal/doctor/doctor_test.go:TestTheDiagnosticSpendsNoProviderQuota
    title: The diagnostic spends no provider quota
    protects:
      invariants:
        - sensei_code.provider.authentication_is_not_readiness
      files:
        - internal/doctor/doctor.go
  - id: internal/workflow/governed_record_coverage_test.go:TestTheAuditRecordCarriesItsRequest
    title: The diff audit record carries the request that produced it
    protects:
      invariants:
        - sensei_code.evidence.a_verdict_is_recorded_with_the_question_that_produced_it
      files:
        - internal/workflow/engine.go
  - id: internal/workflow/governed_record_coverage_test.go:TestEveryGovernedCallSiteIsClassified
    title: Every governed call site is classified as record or context
    protects:
      invariants:
        - sensei_code.evidence.a_verdict_is_recorded_with_the_question_that_produced_it
      files:
        - internal/workflow/engine.go
  - id: internal/setup/graph_address_test.go:TestAnAnswerFromAnotherAddressIsNotReportedAsTheConfiguredOne
    title: A readiness answer from an unasked address is not reported as the configured one
    protects:
      failure_modes:
        - failure.sensei_code.a_readiness_check_reported_on_the_graph_it_did_not_query
      files:
        - internal/setup/checks.go
