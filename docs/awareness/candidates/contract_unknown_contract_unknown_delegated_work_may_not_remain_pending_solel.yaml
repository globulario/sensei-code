contract_unknown:
  - id: contract_unknown.delegated_work_may_not_remain_pending_solely_because_an_exec
    kind: contract_unknown
    title: Delegated work may not remain pending solely because an executor failed to start
    description: 'Observed 2026-08-26/27: two PRs were delegated to a cloud executor that replied it could not start (no environment). The reply never became a terminal work-state; a head-movement watch read the unchanged branches as ''still pending'' for about ten hours. Failure is fine; unrepresented failure is the bug.'
    proposed_contract: 'Assignment lifecycle is explicit and bounded: ASSIGNED -> STARTING -> ACTIVE -> COMPLETED, with terminal transitions WORKER_UNAVAILABLE, WORKER_REFUSED, START_TIMEOUT, EXECUTION_TIMEOUT. A hard refusal fails over immediately; an expired start lease fails over; execution timeout is distinct. Custody transfers to the next executor only after the first lease is closed, never in parallel. Monitors watch worker state, never only ''PR head != old head''.'
    source_files:
      - internal/workflow/engine.go
    evidence:
      - 'globulario/sensei#309 and #310 heads unchanged 80392aaf/de28bbb6 from 03:48Z to 13:30Z while the assignee had refused at assignment time'
