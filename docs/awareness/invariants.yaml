invariants:
  - id: sensei_code.assisted_context.source_is_sensei
    title: Assisted architectural context must come from Sensei and preserve its provenance
    severity: critical
    status: active
    repo: github.com/globulario/sensei-code
    domain: repo
    protects:
      files:
        - internal/assist/
        - internal/assist/packet.go
        - internal/assist/handoff.go
        - cmd/sensei-code/assist.go
    required_tests:
      - internal/assist/packet_test.go:TestBuildUsesSenseiAndCarriesProvenance
      - internal/assist/packet_test.go:TestBuildFailsClosedWhenRequiredSenseiEvidenceIsUnavailable
      - internal/assist/packet_test.go:TestBuildFailsClosedWhenSenseiAnswersWithoutEvidence

  - id: sensei_code.assisted_context.never_claims_admission
    title: Assisted context and handoff packets must never claim governed admission
    severity: critical
    status: active
    repo: github.com/globulario/sensei-code
    domain: repo
    protects:
      files:
        - internal/assist/
        - internal/assist/packet.go
        - internal/assist/handoff.go
        - cmd/sensei-code/assist.go
        - .github/workflows/
    required_tests:
      - internal/assist/packet_test.go:TestHandoffBindsToExactContextAndCannotClaimAdmission

  - id: sensei_code.handoff.bound_to_exact_context
    title: Cross-agent handoff must remain bound to the exact task context it continues
    severity: high
    status: active
    repo: github.com/globulario/sensei-code
    domain: repo
    protects:
      files:
        - internal/assist/handoff.go
        - cmd/sensei-code/assist.go
    required_tests:
      - internal/assist/packet_test.go:TestHandoffBindsToExactContextAndCannotClaimAdmission

  - id: sensei_code.sensei_boundary.refusal_carries_its_reason
    title: A refused or unavailable Sensei surface must carry its reason
    severity: high
    status: active
    repo: github.com/globulario/sensei-code
    domain: repo
    description: "When Sensei refuses a tool call or its server cannot be reached, Sensei Code must propagate the reason Sensei gave. Discarding the tool result text or the server stderr turns a governed refusal into an indistinguishable transport fault and defeats law 8."
    protects:
      files:
        - internal/sensei/mcp.go
    required_tests:
      - internal/sensei/mcp_test.go:TestRefusalReasonIsPreserved
      - internal/sensei/mcp_test.go:TestStderrTailKeepsBoundedSuffix
    contract: Sensei Code fails closed on missing Sensei evidence and names the cause

  - id: sensei_code.provider.credentials_remain_provider_owned
    title: Provider authentication credentials must remain owned by the native provider client
    severity: critical
    status: active
    repo: github.com/globulario/sensei-code
    domain: repo
    protects:
      files:
        - internal/provider/
        - internal/provider/provider.go
        - internal/provider/codex_appserver.go
        - cmd/sensei-code/providers.go
    required_tests:
      - internal/provider/provider_test.go:TestProviderStatusHasNoCredentialFields
      - internal/tui/credentials_test.go:TestTheTUIDelegatesLoginAndHandlesNoCredential
      - internal/tui/credentials_test.go:TestTheTUIUsesProvidersOnlyForIdentityAndDisplay

  - id: sensei_code.provider.unknown_auth_is_not_connected
    title: Unknown provider authentication state must never be rendered as authenticated
    severity: critical
    status: active
    repo: github.com/globulario/sensei-code
    domain: repo
    protects:
      files:
        - internal/provider/
        - internal/provider/provider.go
        - internal/provider/codex_appserver.go
        - internal/doctor/
        - internal/doctor/doctor.go
    required_tests:
      - internal/provider/provider_test.go:TestFormatStatusPreservesUnknownAuth
      - internal/doctor/doctor_test.go:TestWarningsDoNotMasqueradeAsPassButDoNotBlockReadiness

  - id: sensei_code.workflow.execution_is_authorized_once_at_run
    title: /run authorizes the task, and the authority router owns every later interruption
    severity: critical
    status: active
    repo: github.com/globulario/sensei-code
    domain: repo
    description: "Typing /run authorizes Sensei Code to undertake that task within its configured capabilities. The bounded plan is shown as information, never as a gate. After that point only two things may interrupt the human: a Level-3 authority condition the router itself produced, and the publication decision. A mandatory step that interrupts without producing an authority decision is ceremony, and must not exist. This replaces sensei_code.workflow.plan_is_approved_before_work_starts, whose second approval produced no evidence, made no decision the router had not already made, and recorded nothing durable."
    protects:
      files:
        - internal/workflow/
        - internal/workflow/authority.go
        - internal/workflow/engine.go
    required_tests:
      - internal/workflow/engine_test.go:TestRunDoesNotAskForRoutinePlanApproval
      - internal/workflow/engine_test.go:TestOnlyTheAuthorityRouterCreatesALevel3Stop
      - internal/workflow/engine_test.go:TestAGovernedRunCanBeStopped
      - internal/workflow/engine_test.go:TestDecisionRecordNamesTheRealAuthorityOwner
      - internal/workflow/authority_test.go:TestPlanRevisionInsideTheCertifiedEnvelopeDoesNotInterrupt
      - internal/session/interrupted_test.go:TestStoppedTaskRemainsResumable

  - id: sensei_code.conversation.investigation_reads_and_standing_context_is_derived
    title: A conversational turn may read the repository and never change it, and its standing context is derived rather than stored
    severity: high
    status: active
    repo: github.com/globulario/sensei-code
    domain: repo
    description: "The architect is a strong investigator and a non-mutating one, and non-mutating is a property of the code rather than a sentence in a prompt: investigation runs a closed allowlist of read-only git subcommands and refuses everything else by type. What it cannot read it states, because a blank field reads as nothing-to-report. Standing project context is derived from the session record every turn rather than maintained as a summary: a maintained summary is a second store of architectural claims that wins by being convenient the moment it disagrees with Sensei. It carries references, never copied authority, and it cannot make an unpromoted proposal canonical. Assisted mode does not so much as reference governed-artifact machinery."
    protects:
      files:
        - internal/investigate/
        - internal/project/
        - internal/workflow/assisted.go
    required_tests:
      - internal/investigate/investigate_test.go:TestOnlyReadOnlySubcommandsAreReachable
      - internal/investigate/investigate_test.go:TestUnreadableEvidenceIsStatedNotBlank
      - internal/project/project_test.go:TestTheSummaryIsDerivedAndHoldsReferencesNotClaims
      - internal/project/project_test.go:TestBoundsAreDisclosed
      - internal/workflow/mode_test.go:TestAssistedWorkflowCreatesNoGovernedArtifacts

  - id: sensei_code.retrieval.selection_routes_a_query_and_never_creates_a_claim
    title: Retrieval is selected by the question, bounded out loud, and an empty answer is reported rather than widened
    severity: high
    status: active
    repo: github.com/globulario/sensei-code
    domain: repo
    description: "A conversational turn selects evidence from what the question names rather than injecting the same broad reads every time. Reading the question routes a lookup and decides nothing: if the graph has never heard of the target, the turn reports that it was asked and had nothing, and does not widen the query until something comes back or fall through to inference. Only Sensei's typed read surfaces are reachable, never a free-form query and never a writing tool. Every bound is stated, because a turn that consulted four sources out of nine reads exactly like complete coverage to whoever trusts the answer."
    protects:
      files:
        - internal/retrieval/
        - internal/workflow/assisted.go
    required_tests:
      - internal/retrieval/retrieval_test.go:TestSelectionRoutesLookupsFromWhatTheQuestionNames
      - internal/retrieval/retrieval_test.go:TestAnEmptyAnswerIsReportedRatherThanWidened
      - internal/retrieval/retrieval_test.go:TestTheBudgetIsBoundedAndSaysWhatItDropped
      - internal/retrieval/retrieval_test.go:TestOnlyTypedReadSurfacesAreReachable

  - id: sensei_code.conversation.continuity_is_identity_never_memory
    title: A conversation that cannot be resumed says so, and remembered dialogue never becomes evidence
    severity: high
    status: active
    repo: github.com/globulario/sensei-code
    domain: repo
    description: "The architect process starts fresh every turn, so continuity has to be recorded — but what is recorded is identity, not content. A stored provider handle is a continuity hint and never an authority claim, and the local record carries no field that could hold a decision, because a second weaker governance store disagrees with Sensei invisibly. When the thread cannot be resumed the turn states the loss specifically and reconstructs from the session record and Sensei, rather than answering as though the conversation survived. Every turn can show which sources it consulted and in what state, and a source that failed appears as a source that failed."
    protects:
      files:
        - internal/continuity/
        - internal/assist/
        - internal/workflow/assisted.go
    required_tests:
      - internal/continuity/continuity_test.go:TestALostThreadIsStatedAndSpecific
      - internal/continuity/continuity_test.go:TestTheRecordCannotCarryGovernanceContent
      - internal/assist/packet_test.go:TestTheDrawerShowsFailedSourcesRatherThanOmittingThem

  - id: sensei_code.admission.the_chain_is_senseis_and_only_it_establishes_admission
    title: Sensei Code composes the canonical admission chain and never decides admission itself
    severity: critical
    status: active
    repo: github.com/globulario/sensei-code
    domain: repo
    description: "Admission evaluates a convergence bundle, which is Sensei's synthesis output; composing something bundle-shaped locally would produce records that satisfy the schema and mean nothing. So Sensei Code builds argv for synthesis-admit, admit-change, synthesis-apply and verify-admission, wires each step to what the previous one wrote, and reads exit codes — it decides nothing. Only admit-change establishes admission: reviewer acceptance does not, a passing diff audit does not, and a chain that ran without error does not. Admission is permission to attempt rather than proof of correctness, and scope compliance is not correctness certification. A refusal is distinguished from a broken toolchain, and an exit code this build does not recognise is reported as unrecognised rather than mapped onto an existing meaning."
    protects:
      files:
        - internal/admission/
    required_tests:
      - internal/admission/admission_test.go:TestTheChainWiresEachStepToWhatThePreviousOneWrote
      - internal/admission/admission_test.go:TestOnlyTheDecidingStepEstablishesAdmission
      - internal/admission/admission_test.go:TestRefusalAndBreakageAreDistinguished
      - internal/admission/admission_test.go:TestMissingInputsAreRefusedRatherThanGuessed

  - id: sensei_code.candidate.disposition_is_decided_and_evidence_outlives_removal
    title: A candidate is kept or removed by decision, and its evidence is recorded before anything is removed
    severity: critical
    status: active
    repo: github.com/globulario/sensei-code
    domain: repo
    description: "Every governed task creates a worktree and a branch, and a candidate nobody resolved means nothing in particular — which turns recovery from disk into archaeology and erodes the value of an exact persisted base. So each candidate reaches a stated disposition from a closed vocabulary, retention carries the reason that kept it, and nothing is removed before its base, diff and audit evidence are written down. Automatic removal is reached only by a candidate whose own recorded evidence says it holds no work: deleting on exit would perform the deletion half of a publication decision the system correctly refuses to make."
    protects:
      files:
        - internal/candidate/
        - internal/candidate/disposition.go
        - internal/workflow/engine.go
    required_tests:
      - internal/candidate/disposition_test.go:TestRemovalRequiresEvidenceThatOutlivesTheCandidate
      - internal/candidate/disposition_test.go:TestRetentionStatesItsReason
      - internal/candidate/disposition_test.go:TestDispositionVocabularyIsClosed
      - internal/workflow/engine_test.go:TestOnlyAnEmptyCandidateIsRemovedAutomatically

  - id: sensei_code.authority.only_an_explicit_answer_satisfies_a_boundary
    title: The human may stop computation at any time, but only an explicit authority decision can satisfy an authority boundary
    severity: critical
    status: active
    repo: github.com/globulario/sensei-code
    domain: repo
    description: "Esc during ordinary execution stops the run. Esc at a Level-3 rendezvous defers the question instead: once the router has established that a decision is a person's, there is no architect-authorized continuation left, so a keystroke must not be able to mean no. A deferred question is recorded whole and resumed by asking it again verbatim — never by re-running the router, which could produce a different question from a graph that moved and satisfy a boundary nobody was asked about. Ctrl+C stays an operating-system escape hatch and is not part of the governance protocol."
    protects:
      files:
        - internal/workflow/
        - internal/workflow/authority.go
        - internal/workflow/engine.go
        - internal/session/store.go
    required_tests:
      - internal/workflow/engine_test.go:TestDeferredAuthorityIsItsOwnTransition
      - internal/workflow/engine_test.go:TestDeferralCallsNoOneAfterwards
      - internal/workflow/engine_test.go:TestResumeRestoresTheDeferredQuestionWithoutRerouting
      - internal/workflow/engine_test.go:TestOnlyAChosenOptionSatisfiesAnAuthorityBoundary
      - internal/session/interrupted_test.go:TestDeferredAuthorityIsResumableAndCarriesItsQuestion

  - id: sensei_code.workflow.context_never_widens_worker_scope
    title: Shared context explains why a change was asked for and never enlarges what may be changed
    severity: critical
    status: active
    repo: github.com/globulario/sensei-code
    domain: repo
    description: "Workers and the reviewer receive the conversation, the architect's intent and Sensei's evidence. That context must not become a side channel around the approved plan: a worker asked for work the plan does not cover reports it and leaves it undone, and the reviewer's standard of proof is unchanged by it."
    protects:
      files:
        - internal/workflow/
        - internal/workflow/engine.go
    required_tests:
      - internal/workflow/engine_test.go:TestImplementationPromptCarriesContextWithoutWideningScope
      - internal/workflow/engine_test.go:TestReviewPromptCarriesContextWithoutLoweringTheBar
      - internal/workflow/engine_test.go:TestGuidanceReachesTheWorkerWithoutEnlargingThePlan

  - id: sensei_code.publication.never_merges
    title: Sensei Code may open a pull request and may never merge one
    severity: critical
    status: active
    repo: github.com/globulario/sensei-code
    domain: repo
    description: "Publication is human-owned. Sensei's own merge-check verifies that a pull request is merge-authorized and never merges it, and Sensei Code holds the same line. Publication is gated twice, by the configured capability and by the human at the moment, and a pull request is never an admission."
    protects:
      files:
        - internal/publish/
        - internal/publish/publish.go
    required_tests:
      - internal/publish/publish_test.go:TestPullRequestArgsNeverMerge
      - internal/publish/publish_test.go:TestPublicationRefusedWithoutTheCapability
      - internal/publish/publish_test.go:TestBodyCarriesTheReportAndRefusesToClaimAdmission

  - id: sensei_code.capability.declared_push_refusal_is_enforced
    title: A capability the configuration withholds is enforced, not merely requested of the worker
    severity: critical
    status: active
    repo: github.com/globulario/sensei-code
    domain: repo
    description: "Capability flags read as guarantees. When push is not granted a pre-push hook is installed and the worker's git is pointed at it, so git refuses the push rather than the worker being asked not to. The guard lives outside the candidate so it cannot be committed into the change it protects."
    protects:
      files:
        - internal/broker/
        - internal/broker/broker.go
    required_tests:
      - internal/broker/broker_test.go:TestWorkerCannotPushWhenPushIsDenied
      - internal/broker/broker_test.go:TestWorkerCannotForcePushWhenOnlyForceIsDenied
      - internal/broker/broker_test.go:TestBranchDeletionIsRefusedAsAForcePush
      - internal/broker/broker_test.go:TestGrantedPushIsNotObstructed
      - internal/broker/broker_test.go:TestGuardsAreNeverInstalledInsideTheCandidate
      - internal/broker/broker_test.go:TestGuardDirIsOutsideTheWorktreeByConstruction

  - id: sensei_code.evidence.counts_carry_their_provenance
    title: A reported figure states whether it is an exact total, a lower bound, or unpublished
    severity: high
    status: active
    repo: github.com/globulario/sensei-code
    domain: repo
    description: "Sensei publishes exact totals for some classes and none for others, and a bounded query returns at most what it asked for. Presenting those alike is how a report starts lying, as when 144 invariants read as authored governance while 138 were an installed pack. Absence is reported as unmeasured, never as a reassuring zero."
    protects:
      files:
        - internal/architect/
        - internal/architect/report.go
    required_tests:
      - internal/architect/report_test.go:TestInstalledPackIsNotCreditedAsAuthoredGovernance
      - internal/architect/report_test.go:TestClassesWithNoPublishedTotalAreNotShownAsZero
      - internal/architect/report_test.go:TestReportRefusesToPresentCountsAsAnAssessment

  - id: sensei_code.report.states_what_it_does_not_establish
    title: Every report ends with the claims it is not entitled to make
    severity: high
    status: active
    repo: github.com/globulario/sensei-code
    domain: repo
    description: "A change summary reads as a completion claim unless it says otherwise. Reports state that admission was not requested, that reviewer acceptance and passing tests are not proof, and that a class Sensei holds nothing for is knowledge it was never given."
    protects:
      files:
        - internal/report/
        - internal/report/report.go
    required_tests:
      - internal/report/report_test.go:TestReportNeverClaimsAdmissionOrCorrectness
      - internal/report/report_test.go:TestReportFlagsMissingTestsAndAbsentAudit

  - id: sensei_code.learning.never_promotes_its_own_lessons
    title: Recorded knowledge enters a review queue and never the live graph
    severity: critical
    status: active
    repo: github.com/globulario/sensei-code
    domain: repo
    description: "A tool that could promote its own lessons into governance would let one bad afternoon become a permanent rule. Decisions and scars are appended for human review, a decision Sensei would refuse is reported rather than padded to pass, and recording never republishes the graph."
    protects:
      files:
        - internal/decision/
        - internal/decision/record.go
    required_tests:
      - internal/decision/record_test.go:TestUnlinkedDecisionIsRefusedRatherThanPadded
      - internal/decision/record_test.go:TestSourceFilesAloneDoNotSatisfyContractFirst
      - internal/decision/record_test.go:TestArgsNeverRebuildTheGraph

  - id: sensei_code.candidate.reviewer_sees_every_changed_file
    title: The reviewer judges the whole candidate, including files the worker created
    severity: critical
    status: active
    repo: github.com/globulario/sensei-code
    domain: repo
    description: "git diff reports tracked modifications only, so a created file was absent from the candidate diff and the reviewer judged a change with its new files invisible. It rejected real work six times for omitting a test that was on disk. Candidates diff with intent-to-add so created files are visible."
    protects:
      files:
        - internal/gitx/
        - internal/gitx/git.go
    required_tests:
      - internal/gitx/git_test.go:TestCandidateDiffIncludesFilesTheWorkerCreated

  - id: sensei_code.mcp.configuration_only_adds_what_is_missing
    title: Repairing an agent's Sensei access never rewrites configuration the user wrote
    severity: high
    status: active
    repo: github.com/globulario/sensei-code
    domain: repo
    description: "Silently rewriting an agent's own configuration replaces a deliberate choice with a guess. Missing entries are added and existing ones are left exactly as written. A registered server whose tools the agent cannot call is reported as partial, because an unverified route to Sensei is not a route to Sensei."
    protects:
      files:
        - internal/mcpconfig/
        - internal/mcpconfig/mcpconfig.go
    required_tests:
      - internal/mcpconfig/mcpconfig_test.go:TestConfigureLeavesAnExistingEntryAlone
      - internal/mcpconfig/mcpconfig_test.go:TestMissingCodexToolsFindsBlockedEvidenceTools

  - id: sensei_code.outcome.reporting_never_alters_the_result
    title: Recording what happened never changes what happened
    severity: high
    status: active
    repo: github.com/globulario/sensei-code
    domain: repo
    description: "A task that succeeded did succeed whether or not the fact could be filed, so a reporting failure is surfaced and never converts a successful task into a failed one. A refused record is surfaced rather than counted as recorded, and reporting stays off until a project and domain are named so this repository's outcomes are never filed against another's principles."
    protects:
      files:
        - internal/behavioral/
        - internal/behavioral/behavioral.go
    required_tests:
      - internal/behavioral/behavioral_test.go:TestRecordIsSkippedUntilScopedDeliberately
      - internal/behavioral/behavioral_test.go:TestRecordSurfacesARefusalInsteadOfReportingSuccess

  - id: sensei_code.resume.never_skips_a_human_decision
    title: A pending human decision survives resume and is carried verbatim
    severity: critical
    status: active
    repo: github.com/globulario/sensei-code
    domain: repo
    description: "The human decision this protects is the AUTHORITY BOUNDARY (workflow.awaiting_authority), not the plan. /run authorizes the task; the plan is information, not an approval gate. A task interrupted at a deferred authority decision IS offered for resume and carries its question verbatim, so the decision is answered rather than lost or silently re-derived; once answered it is no longer pending. A task that never produced a plan is not offered for a DIFFERENT reason -- there is no candidate to continue, so offering it would restart the work rather than resume it. Sensei evidence is re-read on resume rather than restored from the log, because the graph may have moved while the process was gone.\n\nSUPERSEDES A FALSE STATEMENT, recorded rather than quietly edited. This entry previously read \"A task still awaiting approval is never resumed\" and described an unapproved PLAN as the pending human decision. Under the current architecture that is backwards twice: the plan is not an approval gate, and a deferred authority decision is precisely what resume DOES offer. Its two bound tests passed throughout, because they prove continuity (no plan, nothing to continue) and never proved the approval claim the entry made. The binding resolved; the meaning had moved."
    protects:
      files:
        - internal/session/
        - internal/session/store.go
    required_tests:
      - internal/session/interrupted_test.go:TestDeferredAuthorityIsResumableAndCarriesItsQuestion
      - internal/session/interrupted_test.go:TestAnsweredAuthorityIsNoLongerPending
      - internal/session/interrupted_test.go:TestTaskWithoutAPlanIsNotResumable
      - internal/session/interrupted_test.go:TestFinishedTasksAreNotResumable

  - id: sensei_code.command.unknown_input_is_never_run_as_a_task
    title: An unrecognised command is answered, never handed to the architect as work
    severity: high
    status: active
    repo: github.com/globulario/sensei-code
    domain: repo
    description: "A mistyped command passed through as task text reaches the architect as a feature request. Unknown commands are named as unknown with the closest suggestion, and the command catalogue generates its own help so the listed surface cannot drift from the dispatched one."
    protects:
      files:
        - internal/command/
        - internal/command/command.go
    required_tests:
      - internal/command/command_test.go:TestUnknownCommandIsNotTreatedAsATask
      - internal/command/command_test.go:TestGroupsCoverEveryCommand

  - id: sensei_code.roles.adversarial_roles_inherit_nothing_and_bind_to_a_revision
    title: An adversarial role inherits nothing from the work it judges, and its verdict is bound to the revision it read
    severity: critical
    status: active
    description: Asking a second model whether a change is correct produces a second opinion only if it did not already read the case for the change. The reviewer here was reached through AskFork, which hands it the architect's whole conversation, and its verdict carried no identity for the bytes it read. So a review was correlated with what it judged and could be carried onto a later revision, and neither fact was visible in the transcript. An adversarial role therefore opens a provider session that inherits nothing, cannot be the provider that implemented the candidate, and produces a verdict bound to the exact candidate revision, refused as superseded when the worker edits it.
    protects:
      files:
        - internal/roles/roles.go
        - internal/roles/verdict.go
        - internal/agent/agent.go
        - internal/workflow/adversarial.go
    required_tests:
      - internal/agent/agent_session_test.go:TestAnAdversarialRoleAlwaysStartsFresh
      - internal/roles/roles_test.go:TestARevisionInvalidatesTheVerdictBoundToThePreviousOne
      - internal/roles/roles_test.go:TestAWorkerCannotReviewItsOwnCandidate
      - internal/workflow/adversarial_test.go:TestAReviewRunsInAnIndependentSession
    contract: an independent review is independent of the session, the author, and the revision it did not read
  - id: sensei_code.provider.authentication_is_not_readiness
    title: An authenticated provider is not a ready one, and finding out must not cost a turn
    severity: high
    status: active
    description: 'doctor reported a provider PASS on authentication alone. The identical line appeared on a day Codex was out of quota and on a day it was not, so the check carried no information about the thing that decides whether a run can start at all. Providers own whether they are configured, authenticated and able to serve turns; doctor only projects that confirmed state. Unknown turn-serving capability is reported as UNPROVEN rather than PASS: not a failure, because nothing is known to be broken, and not green, because nothing is known to work. The diagnostic stays side-effect-free and quota-safe, because a readiness check that spends a weekly-budgeted turn to answer itself is one people learn to skip.'
    protects:
      files:
        - internal/doctor/doctor.go
    required_tests:
      - internal/doctor/doctor_test.go:TestAuthenticationAloneIsNotReadiness
      - internal/doctor/doctor_test.go:TestTheDiagnosticSpendsNoProviderQuota
    contract: doctor projects confirmed provider state and never spends provider quota to establish it
  - id: sensei_code.event_bus.subscriber_channel_lifetime_is_the_lock
    title: A subscriber channel is closed only under the write lock Publish reads under
    status: active
    description: 'Bus.Publish sends to each subscriber while holding RLock; the cancel returned by Subscribe deletes the entry and closes the channel while holding Lock. Those are mutually exclusive, so a subscriber channel can never be closed while a send to it is in flight. That mutual exclusion — not the map — is what the RWMutex is protecting: Go panics on a send to a closed channel, and the lock discipline is the only thing preventing it.'
    protects:
      files:
        - internal/event/bus.go
    required_tests:
      - internal/event/bus_test.go:TestCancelClosesTheChannelAndPublishSkipsIt
    evidence:
      - internal/event/bus.go:33 Publish holds b.mu.RLock() for the whole send loop
      - internal/event/bus.go:22 the cancel closure takes b.mu.Lock() before close(c)
      - internal/event/bus_test.go:TestCancelClosesTheChannelAndPublishSkipsIt passes under -race
    contract: Bus.Publish and the Subscribe cancel closure are mutually exclusive; a subscriber channel is never closed while a send to it is in flight
  - id: sensei_code.derived.future_only_a_question_cannot_authorize_the_run_that_wrote_it
    title: A derived question cannot authorize the run that wrote it
    severity: critical
    status: active
    description: 'FUTURE_ONLY. A derived question whose provenance says it was written by task T must not contribute coverage or architectural authority to T. Writing a question cannot authorize the run that wrote it: otherwise a run that could not establish its own authority would establish it by writing something down. Enforced by derived.ExcludingTask applied in coverageAtWorld before any derivation is spent. Observed holding twice on the subject itself in B3 (N1 and N2, 2026-08-28): the investigator''s recorded question ended its own run at the human branch and derived DERIVED for the next encounter.'
    protects:
      files:
        - internal/workflow/engine.go
        - internal/derived/derived.go
        - internal/derived/write.go
    required_tests:
      - internal/workflow/closure_write_test.go:TestDerivedCoverageExcludesTheWritingTask
      - internal/derived/write_test.go:TestARecipeCannotCoverTheRunThatWroteIt
    evidence:
      - 'experiments/b3-self-grounding/runs/N1.receipts.jsonl: recorded in round 2, run exited 3 with 0 anchors'
      - 'experiments/b3-self-grounding/runs/N2.receipts.jsonl: same'
      - 'experiments/b3-self-grounding/manifest.md: mechanical check -- both recipes derive DERIVED at 6c36961'
    contract: A closure round may leave a checkable question behind; that question becomes coverage only if a later task or encounter derives it -- which may be against the same pinned world. Coverage for the writing task is computed over recipes excluding that task's own.
  - id: sensei_code.workflow.repeated_resume_cannot_mint_authority
    title: Resume revalidates recorded authority and never mints new authority
    severity: critical
    status: active
    description: 'REPEATED_RESUME_CANNOT_MINT. Resume may recompute facts only to revalidate authority that was actually recorded by the original routing decision. Resume must never create, persist, strengthen, or emit new authority merely because recomputation in the resumed world would grant it. Enforced by coverageAtWorld (side-effect free) being the only computation resume calls, with derivedCoverage (the recording path) reserved for routing; a record present after a first resume must not appear on a second. Found by review of #101 (5047003424) and closed at e61cee1.'
    protects:
      files:
        - internal/workflow/engine.go
        - internal/workflow/testedit.go
        - internal/workflow/prospective.go
        - internal/session/store.go
    required_tests:
      - internal/workflow/testedit_test.go:TestARepeatedResumeCannotMintTestEditAuthority
      - internal/workflow/testedit_test.go:TestARecordedTestEditGrantIsReEstablishedFromTheWorldOrRefused
    evidence:
      - 'sensei-code #101 review 5047003424: repeated resume minted authority; fixed e61cee1'
    contract: "Routing computes and records authority; resume recomputes only to revalidate what the original routing decision recorded: it refuses when recorded authority cannot be re-established exactly, and it discards -- without failing -- any authority the recomputation would grant that routing never recorded, leaving the run ungranted."
  - id: sensei_code.workflow.unexamined_planned_file_is_not_covered_by_its_neighbour
    title: A planned file the graph never examined is not covered by its neighbour
    severity: critical
    status: active
    description: 'UNEXAMINED_IS_UNCOVERED. A scoped preflight is one coverage verdict for the whole planned region, proven the moment one planned file carries anchors (live: [engine.go, a nonexistent file] answers sufficient=true, direct_anchor_count=3, file_count=2, indexed_file_count=1). Read at the region, a planned file the graph never examined inherits its neighbour''s coverage, and a plan can carry any ungrounded file into an anchored region and launder the region''s authority onto it (M25 §1). The per-file fact is engine-owned (Action.Unexamined, established by Engine.unexaminedFiles per file, never read off the scoped answer, never supplied by a provider); the router treats unexamined architectural files as a coverage gap (coverage-unexamined) closed only by a recognised derivation over every architectural file. Files under an operational grant are not asked to be examined.'
    protects:
      files:
        - internal/workflow/authority.go
        - internal/workflow/engine.go
        - internal/workflow/consequence.go
    required_tests:
      - internal/workflow/unexamined_test.go:TestAnUnexaminedPlannedFileIsNotCoveredByItsNeighbour
      - internal/workflow/unexamined_test.go:TestAnUnexaminedPlannedFileIsCoveredOnlyByADerivationOverIt
      - internal/workflow/unexamined_test.go:TestAnUnexaminedFileUnderAnOperationalGrantOpensNoGap
    contract: 'Coverage is a per-file property: the scoped preflight''s region verdict vouches for a planned file only if the graph examined that file; a file it never examined is uncovered whatever its neighbours carry'
  - id: sensei_code.improvement.stored_knowledge_is_not_improved_behavior
    title: Governed knowledge that is not reachable or not consulted cannot improve behavior by existing
    status: active
    description: 'Measured 2026-09-01: the live evaluator was 159 admitted corpus changes behind, and golang/prospective -- the retrieval machinery built to bring prior law to a change -- was imported by nothing outside its own package and never called in production. So ''autonomously surfaced prior laws = 0'' had a STRUCTURAL cause, not a behavioural one: nothing called it, and the zero would have survived publication. A reflex experiment run in that state would have produced an ambiguous negative that looked like a learning failure.'
    protects:
      files:
        - docs/work/phase4-does-retrieval-participate.md
    forbidden_fixes:
      - 'cite corpus growth, invariant count or published artifacts as evidence of improved behavior: they measure that knowledge exists, which is the premise rather than the claim'
    evidence:
      - grep for golang/prospective outside its own package returns nothing; Retrieve has no production caller; the live store build was 96f19456f5fb from 2026-08-20 while the corpus had moved 159 corpus-touching commits ahead
    contract: Knowledge improves future behavior only by being REACHABLE by the deciding surface and CONSULTED early enough to affect reasoning. Storing it establishes neither. A corpus entry, an invariant, a test binding or a published artifact is evidence that knowledge exists -- never evidence that it participated. built != wired, wired != consulted, consulted != early enough to affect reasoning.
  - id: sensei_code.improvement.a_claim_needs_a_changed_decision_not_a_stored_lesson
    title: A self-improvement claim requires a changed decision, not a stored lesson
    status: active
    description: 'The campaign guards exist because the cheapest way to converge is to delete the evidence that says you have not. This invariant is the same rule applied to the headline claim: a campaign may report knowledge stored, laws admitted, artifacts published and retrieval available, and still have changed no decision. Campaign 001 is exactly that case -- 21 findings repaired, 38 falsifiers added, and autonomously surfaced prior laws measured at zero.'
    protects:
      files:
        - internal/campaign/campaign.go
    forbidden_fixes:
      - 'reinterpret an earlier campaign''s measured zero because a later campaign performed better: the baseline is the thing being beaten and may not move'
    required_tests:
      - internal/campaign/campaign_test.go:TestAGuardMovingTheWrongWayVoidsTheCampaign
      - internal/campaign/campaign_test.go:TestTheReportShowsUnmeasuredAsUnmeasured
    evidence:
      - campaign 001 records autonomously surfaced prior laws as MEASURED zero, distinguished from unmeasured, so a later campaign cannot reinterpret the baseline
    contract: 'A self-improvement claim requires evidence that prior governed experience CHANGED A LATER DECISION OR ACTION. Evidence that the experience was recorded, admitted, published or retrievable is necessary and not sufficient. The causal chain must be reconstructible: which prior lesson, reaching which later subject, retrieved by what relationship, surfaced at what point, and what the agent did differently because of it.'
  - id: sensei_code.evidence.a_verdict_is_recorded_with_the_question_that_produced_it
    title: A verdict is recorded with the question that produced it
    status: active
    description: 'sensei-code#134 preserved a run that stopped at the human authority boundary carrying ''human_approval_required (blast radius cluster)'' and NOT the request that produced it. When the upstream repair landed the specimen could not be replayed, and the escalation no longer reproduced even on the binary that had produced it -- so a post-repair ''local/none'' would have looked exactly like proof and established nothing. #137 repaired one call site; an audit then found ONE OF SIX preflight sites recording its request, so the class was open. internal/evidence is now the single way this workflow records such a call, and a structural test refuses a new emitting site that omits the request. Sites that emit nothing are listed with the reason, so an exemption is a statement rather than an omission.'
    protects:
      files:
        - internal/evidence/envelope.go
        - internal/workflow/engine.go
    forbidden_fixes:
      - 'record the envelope INSTEAD of the result: every existing reader looks for result fields such as risk_class, and displacing them trades one loss for another'
    required_tests:
      - internal/evidence/envelope_test.go:TestAVerdictWithoutItsRequestIsNotReplayable
      - internal/evidence/envelope_test.go:TestTheEnvelopeDoesNotDisplaceTheResult
      - internal/evidence/envelope_test.go:TestAnUncapturedFieldIsAbsentNotEmpty
      - internal/workflow/preflight_request_recorded_test.go:TestEveryEmittedPreflightCarriesItsRequest
    evidence:
      - one of six preflight call sites recorded its request before this change; all emitting sites now do, and dropping one fails TestEveryEmittedPreflightCarriesItsRequest
    contract: 'Every governed call whose result is emitted as a durable record carries its causal envelope: the operation, the exact request, the revision the subject was read at, and the knowledge generation that answered. A record missing its request is a historical observation and must not be cited as replayable proof. An uncaptured field is ABSENT from the record, never present-and-empty, because an empty revision claims one was captured.'
  - id: sensei_code.ghwebhook.signature_authenticates_delivery_not_authority
    title: A GitHub signature authenticates delivery bytes and never authorizes an objective
    severity: critical
    status: active
    description: 'The whole of what the webhook ingress establishes is that GitHub delivered these exact bytes. It does not establish that an objective was authorized, that the sender is an architect or a reviewer, or that a comment should execute anything. The package therefore has no path to the workflow engine: it imports no engine, no resolver and no runner, and that import boundary is pinned by a test rather than left to discipline. SenderID and SenderLogin are metadata carried by an authenticated delivery, never a grant, and no consumer may read them as one. The Sink interface is the entire surface between transport and everything else, so what a delivery can cause is bounded by what that interface can express; widening it, or acquiring an engine handle in order to notify it, is how authenticated quietly becomes authorized.'
    protects:
      files:
        - internal/ghwebhook/
        - internal/ghwebhook/doc.go
        - internal/ghwebhook/delivery.go
        - internal/ghwebhook/sink.go
    required_tests:
      - internal/ghwebhook/boundary_test.go:TestTheIngressCannotReachTheWorkflowEngine
      - internal/ghwebhook/boundary_test.go:TestTheIngressCallsNothingGoverned
      - internal/ghwebhook/webhook_test.go:TestTheSenderIsMetadataAndNotAuthority
      - internal/ghwebhook/webhook_test.go:TestTheObservationSinkRecordsMetadataAndNeverTheCommentBody
    contract: transport authenticity is not authority
  - id: sensei_code.ghwebhook.signature_precedes_every_interpretation
    title: The MAC is verified over exactly the received bytes before anything reads them
    severity: critical
    status: active
    description: verify runs over the raw request body before any parse. A verifier that unmarshalled and re-marshalled would authenticate a document GitHub never sent, because key order, escaping and unicode normalization are all things a round trip may change and a MAC will not forgive. The accepted algorithm is stated rather than parsed out of the header, because a verifier that read the algorithm from the message would let the sender choose it, and the sender is the party being authenticated. The comparison is constant-time, since a MAC is exactly the kind of value an attacker can submit repeatedly. No other request fact -- delivery id, event name, action, sender, or source address -- substitutes for the signature, and an event this transport ignores still requires one.
    protects:
      files:
        - internal/ghwebhook/verify.go
        - internal/ghwebhook/server.go
    required_tests:
      - internal/ghwebhook/boundary_test.go:TestNothingParsesTheBodyBeforeTheSignatureIsChecked
      - internal/ghwebhook/boundary_test.go:TestNoRequestFactSubstitutesForTheSignature
      - internal/ghwebhook/webhook_test.go:TestABodyChangedAfterSigningIsRefused
      - internal/ghwebhook/webhook_test.go:TestAUnicodePayloadVerifiesOverTheRawBytes
      - internal/ghwebhook/webhook_test.go:TestMalformedJSONWithABadSignatureFailsAsAuthentication
      - internal/ghwebhook/webhook_test.go:TestAnIgnoredEventStillRequiresASignature
    contract: a signature covers the bytes that arrived, not a re-encoding of them
  - id: sensei_code.ghwebhook.credential_material_never_leaves_the_process
    title: Only the path of a credential is configuration; its content never reaches an error, log, response or argv
    severity: high
    status: active
    description: 'The webhook shared secret and the GitHub App installation token are read through a configured path, held in the server or client, and never returned to configuration, logged, printed, embedded in an error, placed in argv, or written to any evidence record. Neither the expected nor the received MAC appears in any message, and one single ErrUnauthenticated covers every way authentication can fail, because reporting which stage failed tells an attacker which half of a forgery attempt was already right. A secret readable by group or other is refused at startup rather than warned about: the entire security of this ingress is that only GitHub and this process know those bytes, and a mode that widens this process to anyone with a login has already ended that.'
    protects:
      files:
        - internal/ghwebhook/verify.go
        - internal/ghwebhook/server.go
        - internal/ghbridge/installation.go
        - internal/ghbridge/apiclient.go
    required_tests:
      - internal/ghwebhook/webhook_test.go:TestTheSecretNeverAppearsInAResponse
      - internal/ghwebhook/webhook_test.go:TestTheSecretNeverAppearsInAStartupError
      - internal/ghwebhook/webhook_test.go:TestAWorldReadableSecretIsRefused
      - cmd/sensei-code/webhook_test.go:TestTheWebhookSecretIsConfiguredByPathAndNeverPrinted
      - internal/ghbridge/installation_test.go:TestSecretMaterialNeverAppearsInErrors
      - internal/ghbridge/apiclient_test.go:TestInstallationTokenNeverAppearsInTransportErrors
    contract: an error message must not bring an attacker closer to forging a credential
  - id: sensei_code.ghwebhook.ingress_and_control_surfaces_stay_separate
    title: Two authentication regimes must not share a listener, a handler, or a secret
    severity: high
    status: active
    description: The MCP control surface authenticates a Bearer credential on control.Endpoint; the GitHub webhook authenticates HMAC-SHA256 over the body on ghwebhook.Endpoint. They share no socket, no handler, no secret and no code, deliberately. A single surface holding both would eventually authenticate one regime's request with the other's rule, and the resulting failure would be a silent authorization bypass rather than an error. The webhook listener binds loopback only and registers exactly one pattern, absent configuration leaves it off entirely, and partial configuration is a startup refusal rather than a half-authenticated surface.
    protects:
      files:
        - internal/ghwebhook/server.go
        - internal/ghwebhook/config.go
        - cmd/sensei-code/control.go
    required_tests:
      - cmd/sensei-code/webhook_test.go:TestTheMCPAndWebhookSurfacesAreSeparate
      - cmd/sensei-code/webhook_test.go:TestTheControlCommandBindsTheWebhookOnItsOwnListener
      - internal/ghwebhook/webhook_test.go:TestAConfiguredListenerIsLoopbackOnly
      - internal/ghwebhook/webhook_test.go:TestPartialWebhookConfigurationIsAStartupRefusal
      - internal/ghwebhook/webhook_test.go:TestNoWebhookConfigurationLeavesTheListenerOff
      - internal/ghwebhook/webhook_test.go:TestTheListenerRegistersExactlyOnePattern
    contract: one surface holding two authentication rules will eventually apply the wrong one
  - id: sensei_code.proposal.inert_until_a_local_operator_approves_it
    title: An objective arriving over a transport stays inert data until local authority accepts that exact record
    severity: critical
    status: active
    description: A comment carrying the objective-proposal marker is persisted as an immutable local record and nothing else. Recording one does not submit an objective, wake a review, create a task, resolve a runner, or touch the workflow engine, and the receiving package cannot reach any of those capabilities. Persisting closes only the transport-to-data gap; authority is a separate later act in which a local operator selects the exact stored comment id and the existing local objective socket accepts that operator under its kernel-observed peer checks. Authority is established before any durable receipt is written and before the checkout is inspected, so an unauthorized caller can neither spend a proposal nor learn the state of one.
    protects:
      files:
        - internal/ghwebhook/proposal.go
        - internal/ghwebhook/sink.go
        - cmd/sensei-code/proposal.go
    required_tests:
      - cmd/sensei-code/proposal_test.go:TestAnUnauthorizedSameUIDProcessCannotConsumeAPendingProposal
      - cmd/sensei-code/proposal_test.go:TestAuthorityIsEstablishedBeforeAnyDurableReceipt
      - cmd/sensei-code/proposal_test.go:TestAuthorityIsDecidedBeforeCleanliness
      - cmd/sensei-code/proposal_test.go:TestADirtyCheckoutIsRefusedBeforeTheTokenIsSpent
      - internal/ghwebhook/boundary_test.go:TestTheIngressCallsNothingGoverned
    contract: receiving an objective is not being authorized to pursue it
  - id: sensei_code.proposal.approval_is_durable_and_at_most_once
    title: An uncertain approval must not be retried into a duplicate task
    severity: critical
    status: active
    description: 'BeginApproval writes the durable at-most-once receipt before the local objective channel is called. That ordering is the whole point: if the process dies after the task was accepted but before the receipt can be completed, the receipt remains attempting and a second approval is refused rather than possibly creating the task twice. Redelivery is bound durably on both GitHub identities, because they answer different questions -- the delivery id says whether this delivery was processed before, the comment id says whether this comment already has a proposal. An in-memory set is not that: it forgets on restart, and a restart is precisely when a queued redelivery arrives. Reusing one delivery id for another comment, or one comment id for different objective bytes, is an integrity conflict that is refused rather than overwritten.'
    protects:
      files:
        - internal/ghwebhook/proposal.go
        - cmd/sensei-code/proposal.go
    required_tests:
      - internal/ghwebhook/proposal_test.go:TestApprovalAttemptIsDurableAndAtMostOnce
      - internal/ghwebhook/proposal_test.go:TestProposalStoreDeduplicatesDeliveryAndCommentDurably
      - cmd/sensei-code/proposal_test.go:TestALostSubmissionAfterBeginApprovalStaysAttemptingAndCannotRetry
      - cmd/sensei-code/proposal_test.go:TestAFailureBeforeBeginApprovalLeavesZeroReceipt
    contract: the receipt for a side effect is written before the side effect, not after
  - id: sensei_code.proposal.the_approved_objective_keeps_its_exact_bytes
    title: The bytes a local operator approved are the bytes submitted, identified by their digest
    severity: critical
    status: active
    description: 'The proposal protocol carries the objective as a JSON string so it has one unambiguous identity, refuses unknown fields rather than letting them become future authority knobs, and refuses trailing content. The stored objective is never normalized, trimmed or re-encoded on the way to the task: whitespace inside an approved objective is part of what was approved. Every stored proposal is re-checked against its own digest when loaded, so a record whose bytes and digest disagree fails its immutable identity check instead of being submitted. The digest recorded on the accepted task is the digest of the exact stored bytes, which is what later binds an architect turn to this objective and lets a stale or cross-objective answer be rejected.'
    protects:
      files:
        - internal/ghwebhook/proposal.go
        - cmd/sensei-code/proposal.go
    required_tests:
      - internal/ghwebhook/proposal_test.go:TestObjectiveProposalProtocolIsStrictAndPreservesTheString
      - cmd/sensei-code/proposal_test.go:TestSuccessBindsTheExactStoredObjectiveDigestToTheAcceptedTask
      - cmd/sensei-code/proposal_test.go:TestAProposalWithWhitespaceSubmitsItsExactBytes
    contract: an objective has one byte identity from proposal through approval to task
  - id: sensei_code.ghbridge.the_engine_owns_the_subject_not_the_transport
    title: A carried turn is bound by the engine's own facts, and an answer must match every identity field
    severity: critical
    status: active
    description: 'The workflow mints a turn''s binding from its own recorded facts before the resolver is consulted, and the transport never derives identity back out of the rendered prompt. The two protocols keep separate subjects because they happen at different times: a review is about candidate content and binds task, base, candidate digest and candidate tree, while architecture happens before candidate content exists and binds task, exact objective digest, pinned base and graph build commit. Neither invents the other''s subject in order to reuse an envelope. An answer qualifies only when its request id and every binding field match, so a review of one candidate cannot satisfy the request for its repair and a stale or cross-objective architecture answer cannot steer the current task. Identity headers are parsed strictly -- duplicate and unknown fields are refused rather than ignored -- because ambiguity in presentation must never decide which world an answer belongs to, and prose in the payload cannot inject an identity field. The envelope carries no verdict or decision: what the answer says lives in the JSON contract the workflow parser already owns, and a second representation would agree with the body only until it did not.'
    protects:
      files:
        - internal/ghbridge/
        - internal/ghbridge/marker.go
        - internal/ghbridge/architecture.go
        - internal/ghbridge/architecture_runner.go
        - internal/ghbridge/resolver.go
        - internal/ghbridge/runner.go
    required_tests:
      - internal/ghbridge/architecture_test.go:TestArchitectureEnvelopeRoundTripsExactSubject
      - internal/ghbridge/architecture_test.go:TestArchitectureEnvelopeRefusesAmbiguousIdentityHeaders
      - internal/ghbridge/architecture_test.go:TestArchitectureRunnerRefusesWrongRoleBeforeTransport
      - internal/ghbridge/marker_test.go:TestProseCannotInjectIdentityFields
      - internal/ghbridge/marker_test.go:TestFromBindingLiftsTheWorkflowIdentity
      - internal/ghbridge/marker_test.go:TestAnswersRequiresEveryIdentityField
      - internal/ghbridge/marker_test.go:TestAReviewOfC1DoesNotAnswerTheRequestForC2
      - internal/ghbridge/marker_test.go:TestTransportMarkerCarriesNoVerdict
      - cmd/sensei-code/architecture_bridge_test.go:TestConfiguredBridgeCarriesABoundArchitectTurn
    contract: the envelope says which question an answer belongs to; it never decides what the question is
  - id: sensei_code.ghbridge.transport_never_raises_standing
    title: Carrying a turn over GitHub changes neither the provider identity nor the session mode
    severity: critical
    status: active
    description: 'Three facts stay separate and only the middle one belongs to the bridge: the provider is the identity the workflow assigned, the transport is github, and the session mode is unverified. The resolver returns the assigned provider name unchanged so the provider recorded on the resulting artifact cannot disagree with the provider the engine assigned; GitHub appears only in the resolver label and in event metadata. A turn answered over this transport is stamped roles.Unverified by the orchestrator from the fact that it travelled over a transport at all. It is never read from the reply, and no GitHub property -- comment author, login, commit author, or App installation -- may lift it. Authenticating the configured remote principal grants no objective authority and no reviewer independence, a parsed reply carries no authenticated identity of its own, and the App bot that posts requests cannot answer as the reviewer.'
    protects:
      files:
        - internal/ghbridge/resolver.go
        - internal/ghbridge/runner.go
        - internal/ghbridge/architecture_runner.go
    required_tests:
      - internal/ghbridge/runner_test.go:TestTheBridgePreservesTheAssignedProviderIdentity
      - internal/ghbridge/runner_test.go:TestTransportAnswersAreUnverifiedAndNeverIndependent
      - internal/ghbridge/principal_test.go:TestParsedReviewCarriesNoAuthenticatedIdentity
      - internal/ghbridge/principal_test.go:TestReviewerIsNeverInferredFromANeighbouringFact
      - internal/ghbridge/apiclient_test.go:TestTheAppBotCannotAnswerAsTheReviewer
    contract: no GitHub property may raise a turn above Unverified
  - id: sensei_code.ghbridge.an_unavailable_bridge_refuses_rather_than_substituting
    title: A bridge that cannot serve a turn refuses it and never silently becomes the local agent
    severity: critical
    status: active
    description: 'workflow.resolveRunner propagates a resolver''s refusal and has no path that builds the CLI anyway, so a refusal here cannot decay into a quiet local architect or a quiet local review. A real task whose architecture binding is missing is refused for the same reason: answering it locally would attribute a plan to a party that did not write it and leave nothing in the record to show the substitution. A bare resolver probe with no task id and no binding is not a task turn at all and continues to the composed fallback, which preserves existing non-task behavior without widening what a governed turn may do. An unconfigured Provider carries nothing -- the empty string is not a wildcard -- so a half-built bridge cannot quietly become the answer for every provider in the ladder. Partial App configuration refuses instead of selecting a transport, and a selected App transport refuses rather than falling back to the operator''s personal gh credentials. The engine may still choose an explicitly recorded alternative through its own assignment ladder, which is a decision it makes and records, and a different thing from silent substitution by this bridge.'
    protects:
      files:
        - internal/ghbridge/resolver.go
        - internal/ghbridge/runner.go
        - internal/ghbridge/architecture_runner.go
        - internal/ghbridge/apiclient.go
    required_tests:
      - internal/ghbridge/runner_test.go:TestUnavailableTransportRefusesRatherThanSubstituting
      - internal/ghbridge/runner_test.go:TestRunnerRefusesAnUnboundSubject
      - internal/ghbridge/runner_test.go:TestAnUnconfiguredBridgeCarriesNothing
      - internal/ghbridge/runner_test.go:TestNonReviewerRolesAlwaysReachTheExistingResolver
      - internal/ghbridge/architecture_test.go:TestResolverCarriesOnlyBoundArchitectForItsProvider
      - internal/ghbridge/apiclient_test.go:TestSelectedAppTransportRefusesRatherThanFallingBackToPersonalGH
      - internal/ghbridge/appconfig_test.go:TestEveryPartialAppConfigurationRefusesAndNeverSelectsGH
    contract: a refusal must propagate; substitution without a record is worse than a stop
  - id: sensei_code.ghbridge.a_published_snapshot_is_a_verified_projection
    title: A published review snapshot is a verified projection of the bound candidate, never a new observation
    severity: high
    status: active
    description: 'The snapshot commit is built from the already-captured candidate tree with git commit-tree, so nothing re-stages files, re-reads the working directory, or derives another diff. A snapshot assembled by git add would be a new observation, and if the worktree had moved since the candidate was captured the reviewer would be shown something the workflow never bound to -- a review of an artifact that exists nowhere in the task''s history. Verification is not ceremony: commit-tree will build a commit from any tree it is handed, so the only thing making this commit a projection of the bound tree is reading its tree and parent back out and comparing them. Publication is for inspection only: not admission, not acceptance, not merge authority, not candidate minting.'
    protects:
      files:
        - internal/ghbridge/snapshot.go
    required_tests:
      - internal/ghbridge/runner_test.go:TestSnapshotVerificationRefusesAWrongTree
      - internal/ghbridge/runner_test.go:TestSnapshotVerificationRefusesAWrongParent
      - internal/ghbridge/runner_test.go:TestSnapshotVerificationAcceptsATrueProjection
      - internal/ghbridge/runner_test.go:TestPublishRefusesAMalformedSubject
    contract: the reviewer must be shown the exact artifact the workflow bound, or nothing
  - id: sensei_code.ghbridge.every_remote_exchange_is_bounded
    title: Every exchange with a remote mailbox is bounded and reports why it ended
    severity: high
    status: active
    description: 'DefaultWait is finite by construction and there is no indefinite default: the control path bounds its remote turns by a TTL, and a bridge that blocked forever would let a task wait on a party that will not answer. An unconfigured mailbox is refused immediately rather than polled, so a misconfiguration surfaces as an error instead of a timeout that looks like remote silence. A mailbox read failure is reported immediately and explicitly rather than retried into the deadline, and a cancelled context is reported as cancellation rather than as an absent answer, so the three ways an exchange can end -- refused, failed, and unanswered -- stay distinguishable in the record.'
    protects:
      files:
        - internal/ghbridge/transport.go
        - internal/ghbridge/architecture_transport.go
        - internal/ghbridge/runner.go
        - internal/ghbridge/architecture_runner.go
    required_tests:
      - internal/ghbridge/await_test.go:TestDefaultWaitIsFinite
      - internal/ghbridge/await_test.go:TestUnconfiguredMailboxIsRefusedNotPolled
      - internal/ghbridge/await_test.go:TestMailboxReadFailureIsImmediateAndExplicit
      - internal/ghbridge/await_test.go:TestCancellationIsReportedAsCancellation
    contract: a task must never sit forever on a party that is never going to answer
