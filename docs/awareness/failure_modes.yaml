# Failure Modes — incidents that happened or could happen.
#
# Each entry documents a known failure: what triggers it, what it looks
# like, and how to fix it properly (not just the obvious-but-wrong way).
#
# The most valuable entries come from real incidents. After debugging a
# production issue, encode it here so the same class of bug is caught
# before it ships again.
#
# Schema:
#   id:                  unique.dotted.identifier
#   title:               short description
#   severity:            critical | high | degraded
#   status:              active | fixed | review_only
#   symptoms:            observable signs of the failure
#   root_cause:          technical explanation
#   trigger:             what event or condition causes this
#   architecture_fix:    the correct fix
#   forbidden_fixes:     anti-patterns that make it worse
#   related_invariants:  links to invariants.yaml entries

failure_modes:

# Example — copy and adapt when you record a real failure class:
#  - id: config.env_var_overrides_production_setting
#    title: Environment variable silently overrides production config
#    severity: high
#    status: active
#    symptoms:
#      - "Service uses wrong database in production"
#      - "Config store shows correct value but service ignores it"
#    root_cause: |
#      A developer added os.Getenv("DB_HOST") as a "convenient fallback"
#      during local development. In production, a stale env var from a
#      previous deployment overrode the config store value.
#    trigger: |
#      Any environment where DB_HOST is set (CI, containers with leftover
#      env, systemd units with Environment= from an old config).
#    architecture_fix: |
#      Remove all os.Getenv calls for service config. Config store is the
#      sole source of truth. If the config store is unavailable, the service
#      must fail — not silently use a stale env var.
#    forbidden_fixes:
#      - add_precedence_logic_env_over_config
#      - add_env_var_for_just_this_one_setting
#    related_invariants:
#      - your.real.invariant_id
#      - meta.fallback_must_degrade_semantics
  - id: failure.sensei_code.empty_sensei_tool_response_accepted_as_present_evidence
    title: Empty Sensei tool response accepted as present evidence
    severity: critical
    description: assist.observed() stamped State=Present from the transport outcome alone, never inspecting the result. A Sensei tool that returned successfully with no text and no structured content produced a present-looking observation, and the context packet was written as though Sensei had supplied evidence.
    protects:
      files:
        - internal/assist/packet.go
    related_invariants:
      - sensei_code.assisted_context.source_is_sensei
    required_tests:
      - internal/assist/packet_test.go:TestBuildFailsClosedWhenSenseiAnswersWithoutEvidence
    evidence:
      - 'internal/assist/packet.go observed() hardcoded State: Present'
      - the pre-existing fail-closed test only covered CallTool transport errors, so the empty-response path was uncovered
  - id: failure.sensei_code.invariant_anchored_only_to_a_directory_is_invisible_to_file
    title: Invariant anchored only to a directory is invisible to file-level preflight
    severity: high
    description: 'Writing protects.files with only a trailing-slash directory (internal/provider/) yields package-level briefing but ZERO direct preflight anchors on the files inside it. Preflight returns PREFLIGHT_STATUS_EMPTY and briefing degrades to ''inferred from this package, NOT this file'', so an agent editing the protected file is never told the rule exists. This shipped twice: first on the assist invariants, then again on the provider credential invariants in PR #5. List concrete file paths alongside the directory.'
    protects:
      files:
        - docs/awareness/invariants.yaml
    related_invariants:
      - sensei_code.provider.credentials_remain_provider_owned
    evidence:
      - preflight on internal/provider/provider.go returned PREFLIGHT_STATUS_EMPTY while two critical invariants protected internal/provider/
      - 'briefing reported BRIEFING_STATUS_DEGRADED: anchored to sibling files, NOT to this file'
  - id: failure.sensei_code.provider_auth_state_claimed_from_an_acknowledged_call_instea
    title: Provider auth state claimed from an acknowledged call instead of confirmed with the owner
    severity: critical
    description: Codex acknowledges account/logout and account/login/completed before the credential has settled on disk. LogoutCodex reported 'logged out' and exited 0 while the tokens survived and the next app-server start refreshed them, so the account stayed connected. LoginChatGPT read the account immediately after the completion notification, saw the pre-settle state, and reported 'ChatGPT login did not produce an authenticated Codex account' for a login that had in fact succeeded. Both directions stated the opposite of provider truth. Confirm the owner's settled state with a bounded wait; never report an acknowledged call as an accomplished state change.
    protects:
      files:
        - internal/provider/codex_appserver.go
    related_invariants:
      - sensei_code.provider.unknown_auth_is_not_connected
    required_tests:
      - internal/provider/provider_test.go:TestAwaitAccountStateWaitsForCodexToSettle
      - internal/provider/provider_test.go:TestAwaitAccountStateFailsClosedWhenStateNeverSettles
    evidence:
      - sensei-code logout 2 printed 'logged out' exit 0 while providers still showed connected and ~/.codex/auth.json retained access/refresh/id tokens with last_refresh bumped
      - sensei-code login 1 exited 1 with 'did not produce an authenticated Codex account' while auth.json had been recreated and providers showed connected plus
  - id: sensei_code.review_forked_the_conversation_it_was_judging
    title: The reviewer was handed the architect's conversation and agreed with it
    severity: critical
    description: 'Machine turns on the ChatGPT provider all went through AskFork, which forks the human architectural thread so a JSON contract does not pollute the visible chat. That is right for the architect and wrong for the reviewer: forking carries the architect''s entire case for the change into the session of the role whose job is to attack it. An attacker that has already read the argument agrees more often than one that looked at the artifact cold, and the transcript cannot tell the two apart, so a correlated opinion was being recorded as an independent review.'
    protects:
      files:
        - internal/agent/agent.go
        - internal/provider/chatgpt_session.go
    related_invariants:
      - sensei_code.roles.adversarial_roles_inherit_nothing_and_bind_to_a_revision
    required_tests:
      - internal/agent/agent_session_test.go:TestAnAdversarialRoleAlwaysStartsFresh
    evidence:
      - internal/provider/chatgpt_session.go AskFork was reached for req.Role == Reviewer
      - the reviewer verdict carried no candidate identity, so it could also be carried onto a later revision
    contract: an independent review is independent of the session, the author, and the revision it did not read
  - id: failure.diagnostic_elevates_a_configured_default_into_a_claim_of_cer
    title: Diagnostic elevates a configured default into a claim of certified repository authority
    description: A default is a starting point, not a statement about the repository. doctor compared each agent's MCP endpoint against config.Sensei.Args without knowing whether that address came from .sensei-code/config.json or from config.Default(), and reported the difference as 'this repository certifies against <default>'. Configured is not certified, reachable is not authoritative, and a default is not discovered truth.
    protects:
      files:
        - internal/mcpconfig/mcpconfig.go
        - internal/doctor/doctor.go
    related_invariants:
      - sensei_code.evidence.counts_carry_their_provenance
    required_tests:
      - internal/mcpconfig/mcpconfig_test.go:TestADefaultAddressIsNotEvidenceThatAnEntryIsStale
      - internal/mcpconfig/mcpconfig_test.go:TestConfigureRefusesToRewriteAnEntryOnTheAuthorityOfADefault
    evidence:
      - doctor reported 'this repository certifies against localhost:10120', an address supplied only by config.Default()
      - the entry it called stale pointed at localhost:10122, the authoritative graph for this repository's domain
      - the prescribed repair 'sensei-code mcp codex' was followed and repointed both agents at a two-day-old graph serving github.com/globulario/services; the system became more wrong by following the diagnostic
  - id: failure.a_claimant_supplied_label_established_the_property_the_label
    title: a claimant-supplied label established the property the label names
    description: 'The same structural defect shipped twice in one day, in two layers that did not know about each other. In both, a model wrote a word into a source field and the receiving code read that word as the evidentiary property it names. In the router, Claim.Source == ''repository'' let a premise reach RouteArchitectural without anything checking that a repository was read. In the observation-to-repair bridge, the same word made a finding eligible to open autonomous repair work without anything checking that the file was opened. The general shape: a semantic label supplied by the claimant must not itself establish the evidentiary property that label names. It is not enough to require that claims CARRY provenance; the provenance value is itself claimant-controlled and needs something independent standing behind it.'
    protects:
      files:
        - internal/workflow/authority.go
    related_invariants:
      - sensei_code.evidence.counts_carry_their_provenance
    required_tests:
      - internal/finding/finding_test.go:TestAFindingAboutAFileTheObservationNeverReadIsNotWork
    evidence:
      - 'Instance 1: internal/workflow/authority.go decideRouteForAction checked only EqualFold(Source, ''inference''), so every other value including '''' reached a grant. Fixed in sensei-code#80 by a closed vocabulary, but ''graph'' and ''repository'' are still accepted on the word alone. Instance 2: internal/finding/finding.go Classify read the same field to decide Eligible(), so a finding claiming source ''repository'' about a file the observation never opened could open a governed repair. Fixed in sensei-code#79 by requiring every file a finding names to appear in the files the observation actually read. Both found by sensei-code auditing itself.'
  - id: sensei_code.workflow.region_coverage_granted_an_unexamined_planned_file
    title: Region-level coverage granted a planned file the graph never examined
    severity: critical
    description: The router read coverage once for the whole planned region (coverageAbsent := !scoped.Coverage.Proven()). Sensei's region verdict is sufficient=true as soon as one planned file carries anchors, so a planned file the graph had never examined -- real and unindexed, or nonexistent -- was granted architectural-authority-granted on its neighbour's invariants. Found by re-measuring B3 N3 per file (slice 3, 2026-08-28); the specimen TestAnUnexaminedPlannedFileIsNotCoveredByItsNeighbour granted before the repair.
    protects:
      files:
        - internal/workflow/authority.go
    related_invariants:
      - sensei_code.workflow.unexamined_planned_file_is_not_covered_by_its_neighbour
    required_tests:
      - internal/workflow/unexamined_test.go:TestAnUnexaminedPlannedFileIsNotCoveredByItsNeighbour
    evidence:
      - 'live preflight over [internal/workflow/engine.go, internal/workflow/zz_not_in_graph.go] on graph 42e6e12c: status OK, sufficient=true, direct_anchor_count=3, file_count=2, indexed_file_count=1'
      - 'same over [engine.go, internal/workflow/relevance.go] (real, unindexed): identical counts; relevance.go alone: sufficient=false indexed=0'
