# Failure Modes — incidents that happened or could happen.
#
# Each entry documents a known failure: what triggers it, what it looks
# like, and how to fix it properly (not just the obvious-but-wrong way).
#
# The most valuable entries come from real incidents. After debugging a
# production issue, encode it here so the same class of bug is caught
# before it ships again.
#
# Schema:
#   id:                  unique.dotted.identifier
#   title:               short description
#   severity:            critical | high | degraded
#   status:              active | fixed | review_only
#   symptoms:            observable signs of the failure
#   root_cause:          technical explanation
#   trigger:             what event or condition causes this
#   architecture_fix:    the correct fix
#   forbidden_fixes:     anti-patterns that make it worse
#   related_invariants:  links to invariants.yaml entries

failure_modes:

# Example — copy and adapt when you record a real failure class:
#  - id: config.env_var_overrides_production_setting
#    title: Environment variable silently overrides production config
#    severity: high
#    status: active
#    symptoms:
#      - "Service uses wrong database in production"
#      - "Config store shows correct value but service ignores it"
#    root_cause: |
#      A developer added os.Getenv("DB_HOST") as a "convenient fallback"
#      during local development. In production, a stale env var from a
#      previous deployment overrode the config store value.
#    trigger: |
#      Any environment where DB_HOST is set (CI, containers with leftover
#      env, systemd units with Environment= from an old config).
#    architecture_fix: |
#      Remove all os.Getenv calls for service config. Config store is the
#      sole source of truth. If the config store is unavailable, the service
#      must fail — not silently use a stale env var.
#    forbidden_fixes:
#      - add_precedence_logic_env_over_config
#      - add_env_var_for_just_this_one_setting
#    related_invariants:
#      - your.real.invariant_id
#      - meta.fallback_must_degrade_semantics
  - id: failure.sensei_code.empty_sensei_tool_response_accepted_as_present_evidence
    title: Empty Sensei tool response accepted as present evidence
    severity: critical
    description: assist.observed() stamped State=Present from the transport outcome alone, never inspecting the result. A Sensei tool that returned successfully with no text and no structured content produced a present-looking observation, and the context packet was written as though Sensei had supplied evidence.
    protects:
      files:
        - internal/assist/packet.go
    related_invariants:
      - sensei_code.assisted_context.source_is_sensei
    required_tests:
      - internal/assist/packet_test.go:TestBuildFailsClosedWhenSenseiAnswersWithoutEvidence
    evidence:
      - 'internal/assist/packet.go observed() hardcoded State: Present'
      - the pre-existing fail-closed test only covered CallTool transport errors, so the empty-response path was uncovered
  - id: failure.sensei_code.invariant_anchored_only_to_a_directory_is_invisible_to_file
    title: Invariant anchored only to a directory is invisible to file-level preflight
    severity: high
    description: 'Writing protects.files with only a trailing-slash directory (internal/provider/) yields package-level briefing but ZERO direct preflight anchors on the files inside it. Preflight returns PREFLIGHT_STATUS_EMPTY and briefing degrades to ''inferred from this package, NOT this file'', so an agent editing the protected file is never told the rule exists. This shipped twice: first on the assist invariants, then again on the provider credential invariants in PR #5. List concrete file paths alongside the directory.'
    protects:
      files:
        - docs/awareness/invariants.yaml
    related_invariants:
      - sensei_code.provider.credentials_remain_provider_owned
    evidence:
      - preflight on internal/provider/provider.go returned PREFLIGHT_STATUS_EMPTY while two critical invariants protected internal/provider/
      - 'briefing reported BRIEFING_STATUS_DEGRADED: anchored to sibling files, NOT to this file'
  - id: failure.sensei_code.provider_auth_state_claimed_from_an_acknowledged_call_instea
    title: Provider auth state claimed from an acknowledged call instead of confirmed with the owner
    severity: critical
    description: Codex acknowledges account/logout and account/login/completed before the credential has settled on disk. LogoutCodex reported 'logged out' and exited 0 while the tokens survived and the next app-server start refreshed them, so the account stayed connected. LoginChatGPT read the account immediately after the completion notification, saw the pre-settle state, and reported 'ChatGPT login did not produce an authenticated Codex account' for a login that had in fact succeeded. Both directions stated the opposite of provider truth. Confirm the owner's settled state with a bounded wait; never report an acknowledged call as an accomplished state change.
    protects:
      files:
        - internal/provider/codex_appserver.go
    related_invariants:
      - sensei_code.provider.unknown_auth_is_not_connected
    required_tests:
      - internal/provider/provider_test.go:TestAwaitAccountStateWaitsForCodexToSettle
      - internal/provider/provider_test.go:TestAwaitAccountStateFailsClosedWhenStateNeverSettles
    evidence:
      - sensei-code logout 2 printed 'logged out' exit 0 while providers still showed connected and ~/.codex/auth.json retained access/refresh/id tokens with last_refresh bumped
      - sensei-code login 1 exited 1 with 'did not produce an authenticated Codex account' while auth.json had been recreated and providers showed connected plus
  - id: sensei_code.review_forked_the_conversation_it_was_judging
    title: The reviewer was handed the architect's conversation and agreed with it
    severity: critical
    description: 'Machine turns on the ChatGPT provider all went through AskFork, which forks the human architectural thread so a JSON contract does not pollute the visible chat. That is right for the architect and wrong for the reviewer: forking carries the architect''s entire case for the change into the session of the role whose job is to attack it. An attacker that has already read the argument agrees more often than one that looked at the artifact cold, and the transcript cannot tell the two apart, so a correlated opinion was being recorded as an independent review.'
    protects:
      files:
        - internal/agent/agent.go
        - internal/provider/chatgpt_session.go
    related_invariants:
      - sensei_code.roles.adversarial_roles_inherit_nothing_and_bind_to_a_revision
    required_tests:
      - internal/agent/agent_session_test.go:TestAnAdversarialRoleAlwaysStartsFresh
    evidence:
      - internal/provider/chatgpt_session.go AskFork was reached for req.Role == Reviewer
      - the reviewer verdict carried no candidate identity, so it could also be carried onto a later revision
    contract: an independent review is independent of the session, the author, and the revision it did not read
  - id: failure.diagnostic_elevates_a_configured_default_into_a_claim_of_cer
    title: Diagnostic elevates a configured default into a claim of certified repository authority
    description: A default is a starting point, not a statement about the repository. doctor compared each agent's MCP endpoint against config.Sensei.Args without knowing whether that address came from .sensei-code/config.json or from config.Default(), and reported the difference as 'this repository certifies against <default>'. Configured is not certified, reachable is not authoritative, and a default is not discovered truth.
    protects:
      files:
        - internal/mcpconfig/mcpconfig.go
        - internal/doctor/doctor.go
    related_invariants:
      - sensei_code.evidence.counts_carry_their_provenance
    required_tests:
      - internal/mcpconfig/mcpconfig_test.go:TestADefaultAddressIsNotEvidenceThatAnEntryIsStale
      - internal/mcpconfig/mcpconfig_test.go:TestConfigureRefusesToRewriteAnEntryOnTheAuthorityOfADefault
    evidence:
      - doctor reported 'this repository certifies against localhost:10120', an address supplied only by config.Default()
      - the entry it called stale pointed at localhost:10122, the authoritative graph for this repository's domain
      - the prescribed repair 'sensei-code mcp codex' was followed and repointed both agents at a two-day-old graph serving github.com/globulario/services; the system became more wrong by following the diagnostic
  - id: failure.a_claimant_supplied_label_established_the_property_the_label
    title: a claimant-supplied label established the property the label names
    description: 'The same structural defect shipped twice in one day, in two layers that did not know about each other. In both, a model wrote a word into a source field and the receiving code read that word as the evidentiary property it names. In the router, Claim.Source == ''repository'' let a premise reach RouteArchitectural without anything checking that a repository was read. In the observation-to-repair bridge, the same word made a finding eligible to open autonomous repair work without anything checking that the file was opened. The general shape: a semantic label supplied by the claimant must not itself establish the evidentiary property that label names. It is not enough to require that claims CARRY provenance; the provenance value is itself claimant-controlled and needs something independent standing behind it.'
    protects:
      files:
        - internal/workflow/authority.go
    related_invariants:
      - sensei_code.evidence.counts_carry_their_provenance
    required_tests:
      - internal/finding/finding_test.go:TestAFindingAboutAFileTheObservationNeverReadIsNotWork
    evidence:
      - 'Instance 1: internal/workflow/authority.go decideRouteForAction checked only EqualFold(Source, ''inference''), so every other value including '''' reached a grant. Fixed in sensei-code#80 by a closed vocabulary, but ''graph'' and ''repository'' are still accepted on the word alone. Instance 2: internal/finding/finding.go Classify read the same field to decide Eligible(), so a finding claiming source ''repository'' about a file the observation never opened could open a governed repair. Fixed in sensei-code#79 by requiring every file a finding names to appear in the files the observation actually read. Both found by sensei-code auditing itself.'
  - id: sensei_code.workflow.region_coverage_granted_an_unexamined_planned_file
    title: Region-level coverage granted a planned file the graph never examined
    severity: critical
    description: The router read coverage once for the whole planned region (coverageAbsent := !scoped.Coverage.Proven()). Sensei's region verdict is sufficient=true as soon as one planned file carries anchors, so a planned file the graph had never examined -- real and unindexed, or nonexistent -- was granted architectural-authority-granted on its neighbour's invariants. Found by re-measuring B3 N3 per file (slice 3, 2026-08-28); the specimen TestAnUnexaminedPlannedFileIsNotCoveredByItsNeighbour granted before the repair.
    protects:
      files:
        - internal/workflow/authority.go
    related_invariants:
      - sensei_code.workflow.unexamined_planned_file_is_not_covered_by_its_neighbour
    required_tests:
      - internal/workflow/unexamined_test.go:TestAnUnexaminedPlannedFileIsNotCoveredByItsNeighbour
    evidence:
      - 'live preflight over [internal/workflow/engine.go, internal/workflow/zz_not_in_graph.go] on graph 42e6e12c: status OK, sufficient=true, direct_anchor_count=3, file_count=2, indexed_file_count=1'
      - 'same over [engine.go, internal/workflow/relevance.go] (real, unindexed): identical counts; relevance.go alone: sufficient=false indexed=0'
  - id: failure.sensei_code.terminal_summary_erases_verdict_and_environmental_cause
    title: Terminal aggregation erases the reviewer verdict and the environmental reason acceptance could not be established
    severity: warning
    description: 'NOT a claim that an accepted candidate was refused. judgeCandidate is right: a reviewer ACCEPT over an audit that could not be performed yields acceptance{Refusal, Overrode:true}, never Accepted, and TestUnverifiableAuditIsNotAcceptance pins that -- it must not be weakened. Reviewer ACCEPT is evidence of code-review approval; it is NOT candidate acceptance while the governing audit is unverifiable. The defect is narrower: the engine holds the reviewer verdict, the override attempt, and audit.Diagnostic() naming the environmental cause, and the terminal summary discards all three to say only that no bounded implementor produced an acceptable candidate. That attributes the outcome to the implementors when the operative fact was that acceptance COULD NOT BE ESTABLISHED because the evaluator was unreachable. Evaluator unavailability must be reported as what it is and never presented as a code defect; a terminal summary must name which dimension ended the run.'
    protects:
      files:
        - internal/workflow/engine.go
    related_invariants:
      - sensei_code.report.states_what_it_does_not_establish
      - sensei_code.evidence.counts_carry_their_provenance
    evidence:
      - 'witness B session-20260831T003000, candidate aebb428c68ab: reviewer returned ACCEPT at 01:25:30 after verifying the candidate against internal/sensei/mcp.go source behaviour'
      - same instant, run.receipt INCOMPLETE / FAILED with summary 'no bounded implementor produced an acceptable candidate'
      - 'the per-worker detail was truthful: the codex lane read ''Sensei could not verify this candidate and no edit to it would change that ... reason codes: evaluator_unavailable'' -- correct attribution to an environmental condition, discarded by the summary above it'
      - 'internal/workflow/gate.go judgeCandidate: with audit.ReviewerMayAccept() false the result is acceptance{Refusal: audit.Diagnostic(), Overrode: true} -- so the run was correct that no candidate was ACCEPTED; what it lost was why'
      - 'a verification-only rerun AFTER the evaluator was restored establishes acceptability from that point on, not retroactively: frozen candidate b26f46c81ce9e8ff884e95d85ff8a9765e02e574, sensei gate --enforce PASS 0 blocking, verify-admission scope_compliant'
  - id: failure.sensei_code.stale_lane_failure_reported_as_current_outcome
    title: Cycle accounting carries a stale lane failure across later revisions and an acceptance
    severity: high
    description: 'A per-worker lane verdict is frozen when it is first reached and is quoted at terminal time as the current outcome, even after the candidate has been revised and a later reviewer has returned ACCEPT (a code-review verdict, which is not candidate acceptance while the audit is unverifiable). The identical-diff detector is the usual source: it reads only the diff digest, so a cycle whose CORRECT answer produced no diff -- a returned unexecuted request, an out-of-envelope deliverable, a refusal to edit without admission -- is recorded as the worker ignoring feedback. A lane verdict must be re-evaluated against the newest candidate and review, or explicitly marked historical, before it may appear in a terminal message.'
    protects:
      files:
        - internal/workflow/engine.go
    related_invariants:
      - sensei_code.report.states_what_it_does_not_establish
      - sensei_code.evidence.counts_carry_their_provenance
    evidence:
      - 'witness B: the claude lane verdict was recorded at 01:02:51Z and quotes the 00:58:46Z review, whose only blocking finding required a deliverable that cannot appear in a diff (return an unexecuted sensei propose request, do not edit docs/awareness); the worker complied exactly and reported ''What this cycle changed: Nothing in the code'''
      - codex independently reached the same correct answer at 01:04 and was recorded the same way -- two implementers, one finding, both labelled non-convergent
      - by 01:25 the candidate had been revised twice more (14464 -> 16166 -> 16593 bytes) and a reviewer had returned ACCEPT; the terminal message still quoted the 01:02:51Z lane state
      - 'witness A precedent, session-20260830T222300: both lanes refused to edit for lack of admission -- codex said ''Blocked before mutation: Sensei workspace status reports task_identity: not_requested'' -- and both were reported as producing an identical diff after being asked to revise'
  - id: failure.sensei_code.configured_evaluator_endpoint_has_no_supervised_process
    title: Admission is deferred by an unserved configured evaluator endpoint
    severity: high
    description: DEPLOYMENT AND AVAILABILITY, not engine semantics. .sensei/config.yaml names the evaluator at localhost:10122 and no supervised process serves it, so every Sensei call spends its first hop on a refused address and scoped calls fall back to an endpoint that cancels them. Diff audit then returns evaluator_unavailable and admission cannot be established. Evaluator unavailability must DEFER admission -- it must not be repaired by weakening the fail-closed gate, and must not be repaired by silently changing the authority referent to whichever endpoint happens to answer. Scope compliance is not correctness certification, and neither is a reachable evaluator.
    protects:
      files:
        - .sensei/config.yaml
    related_invariants:
      - sensei_code.sensei_boundary.refusal_carries_its_reason
      - sensei_code.admission.the_chain_is_senseis_and_only_it_establishes_admission
    evidence:
      - 'witness B 01:19:30Z, diff audit of the candidate that was accepted six minutes later: decision cannot_verify, availability cannot_verify, findings_count 0 -- silence, not a pass'
      - 'the terminal message at 01:25:30Z named the cause: ''Sensei audit could not verify this candidate and no edit to it would change that ... reason codes: evaluator_unavailable, evaluator_unavailable, evaluator_unavailable ... awareness-graph transport failed on all configured addresses: localhost:10122: connection refused; localhost:10120: stream terminated by RST_STREAM with error code: CANCEL; localhost:9090: context deadline exceeded'''
      - the only serving instance was systemd awg-awareness-graph.service on :10120, configured for a DIFFERENT repository (-home-domain github.com/globulario/services, -awareness-dir services/docs/awareness, -no-seed)
      - 'that unit does not start at boot: systemd finds an ordering cycle awg-awareness-graph -> awg-oxigraph -> default.target and deletes its start job'
      - 'WORKING REPAIR: a second awareness-graph on :10122 with flags identical to the :10120 unit; workspace status then reports composition complete, coverage sufficient, no limitations, and sensei gate --enforce verifies'
      - 'REPAIR THAT BREAKS CERTIFICATION: an instance on :10122 carrying sensei-code''s own marker and home domain -- its Metadata RPC stalls and workspace composition reads unavailable'
      - 'a preservation commit of a candidate changes custody without changing content, and can invalidate workspace-bound evidence: verify-admission returned admission.verify.base_revision_changed until the original base plus uncommitted three-file diff was reconstructed'
  - id: failure.sensei_code.acceptance_decision_has_no_identifiable_governing_test
    title: Sensei cannot identify the governing test for the function that decides acceptance
    severity: high
    description: 'internal/workflow/gate.go holds judgeCandidate, which decides whether a candidate may be accepted, and it carries ZERO governing rules and no required-test relationship. TestUnverifiableAuditIsNotAcceptance is load-bearing over it -- it is what keeps a reviewer ACCEPT from becoming candidate acceptance over an audit that could not be performed -- and Sensei cannot see that, because no invariant claims the file. A write scope containing only gate.go is therefore refused with ''write or high-risk scope has no identifiable required Test'', while the same work inside a wider envelope containing internal/workflow/engine.go is admitted, because THAT file carries invariants with named tests. The refusal is correct; the defect is that coverage is concentrated in the orchestration file and absent from the decision one. THE PROOF IS NAMED HERE rather than left for the publisher to invent: the required_tests binding below is the relationship the marker-owning process should publish.'
    protects:
      files:
        - internal/workflow/gate.go
    required_tests:
      - internal/workflow/gate_test.go:TestUnverifiableAuditIsNotAcceptance
      - internal/workflow/gate_test.go:TestReviewerMayStillAcceptWhatSenseiPermits
    related_invariants:
      - sensei_code.admission.the_chain_is_senseis_and_only_it_establishes_admission
      - sensei_code.evidence.counts_carry_their_provenance
    evidence:
      - 'prepare-change over internal/workflow/gate.go and gate_test.go -> Inspect admitted, Modify waiting, blocker.agent.5ab07c4759c3 ''write or high-risk scope has no identifiable required Test'''
      - 'preflight over those two files: PREFLIGHT_STATUS_EMPTY, LOW_RISK, CONFIDENCE_LOW, anchors=0, and no invariant in docs/awareness/invariants.yaml names gate.go -- while internal/workflow/engine.go beside it returns PREFLIGHT_STATUS_OK, ARCHITECTURE_SENSITIVE, CONFIDENCE_HIGH, anchors=6, named by 7 invariants'
      - 'severity high rather than warning: this is degraded governance coverage on the acceptance path itself, and the repository already classifies file-level invisibility from missing anchors as high; critical would overstate it because admission still fails closed'
      - 'roadmap consequence: stage 2 of the observation layer is DEFERRED, not failed, because its target cannot satisfy the dogfood precondition; stage 3 on engine.go advances first, where the mechanism can be tested rather than worked around'
  - id: failure.sensei_code.narrow_write_scope_less_admissible_than_broad_one
    title: An ungoverned package makes a narrow write scope less admissible than a broader one
    severity: warning
    description: 'internal/taskstate is indexed by the graph but carries no governing rule and no required-test relationship, so a write scope containing only that package is refused with ''write or high-risk scope has no identifiable required Test''. Recorded SEPARATELY from the acceptance-decision gap because the two need different proofs and different repairs. The proof is now bound rather than deferred: the package''s contract is that task state is the durable epistemic record of a run and NEVER carries authority, that a foreign or unreadable state fails closed, that an unrecognised version is refused rather than guessed at, and that reading legacy state writes nothing. The required_tests below are the existing tests that hold those, so publication carries a relationship instead of leaving the marker owner to invent one. A narrowly scoped, more honest task is less admissible than a broader one, which pressures authors toward wider envelopes -- the opposite of what bounded scope is for. This is NOT a reason to weaken admission: the repair is to publish the missing bindings through the marker-owning process, not to relax the rule or borrow anchors from an unrelated package in the same task.'
    protects:
      files:
        - internal/taskstate/state.go
    required_tests:
      - internal/taskstate/state_test.go:TestHandoverCarriesNoAuthority
      - internal/taskstate/state_test.go:TestUnreadableOrForeignStateFailsClosed
      - internal/taskstate/state_test.go:TestUnknownFutureVersionIsRefusedNotUpgraded
      - internal/taskstate/state_test.go:TestLoadingV1WritesNothing
    related_invariants:
      - sensei_code.evidence.counts_carry_their_provenance
    evidence:
      - '2026-08-31: prepare-change over internal/taskstate/state.go and state_test.go alone -> Inspect admitted, Modify waiting, same blocker'
      - 'the same work as part of a six-file envelope including internal/workflow -> Modify admitted immediately'
      - 'consequence accepted rather than worked around: stage 1 of the observation-layer work was hand-built under review instead of governed'