# OPTIONAL, and independent of the :10122 repair. The :10120 unit declares
# StartLimitBurst/StartLimitIntervalSec in [Service], where systemd ignores
# them, so its retry bound has never applied. This restores the intent the
# unit's own comment describes ("five failures in two minutes and it stops").
#
# Install as:
#   ~/.config/systemd/user/awg-awareness-graph.service.d/10-startlimit-in-unit.conf
[Unit]
StartLimitBurst=5
StartLimitIntervalSec=120
