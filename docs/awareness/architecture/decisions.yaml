      - internal/tui/setup_command_test.go
  - id: decision.sensei_code.add_test_only_coverage_at_the_tui_input_boundary_proving_unk
    title: Add test-only coverage at the TUI input boundary proving unknown slash commands remain informational and start no task.
    status: accepted
    architectural_plane: intended
    rationale: Add a table-driven unit test proving that an unknown TUI slash command cannot start governed execution. Do not change product behaviour.
    context: Accepted by the human in an interactive Sensei Code session.
    consequences: The repository gains deterministic regression proof at the real TUI boundary that unrecognised slash commands cannot become assisted or governed work; runtime behavior is unchanged.
    related_invariants:
      - sensei_code.command.unknown_input_is_never_run_as_a_task
    source_files:
      - internal/tui/model_test.go
  - id: decision.sensei_code.fail_closed_when_claim_provenance_is_missing_or_outside_the
    title: Fail closed when claim provenance is missing or outside the declared graph|repository|inference vocabulary.
    status: accepted
    architectural_plane: intended
    rationale: |-
      Repair a defect an earlier read-only audit of this repository observed.
    
      Observed defect: [Blocker · Proven] Claim.Source at internal/workflow/authority.go:78 declares the closed vocabulary graph|repository|inference, but decideRouteForAction at lines 396-411 only recognizes inference; every empty or unknown source falls through to RouteArchitectural at line 413. decodeModelJSON in internal/workflow/engine.go:1961-1977 performs no field validation, and the focused tests exercise valid source labels only. Therefore malformed provenance can promote an unchecked premise to architectural authority.
      Where: internal/workflow/authority.go:Claim and decideRouteForAction
      Files named by the observation: internal/workflow/authority.go, internal/workflow/engine.go
      Observed at revision: 5e971479b3a0e4f1c34ece91a14c5d29042f6a0a
      Source of the observation: repository
    
      This finding is EVIDENCE, not authority. It grants nothing. Before changing anything:
        - re-check the CURRENT repository yourself and confirm the defect is still present;
        - if it is absent, already fixed, or you cannot establish it, say so and change nothing;
        - decide the correct fix yourself. No fix has been supplied to you.
    
      Keep the change minimal and do not alter unrelated behaviour. Add whatever tests establish that the defect cannot return.
    context: 'decision_authority: architectural; certified_by: github.com/globulario/sensei-code @ 96f19456f5fb; decided_by: ChatGPT; human_authorization: task execution via /run'
    consequences: Malformed or missing claim provenance can no longer manufacture architectural authority. Valid graph and repository claims continue to route as before, inference remains bounded verification work, and the model JSON wire format is unchanged.
    related_invariants:
      - sensei_code.authority.only_an_explicit_answer_satisfies_a_boundary
      - sensei_code.workflow.execution_is_authorized_once_at_run
    source_files:
      - internal/workflow/authority.go
      - internal/workflow/authority_test.go
  - id: decision.sensei_code.prospective_authority_for_a_new_surface_existing_governed_fa
    title: 'Prospective authority for a new surface: existing governed facts authorize a bounded CREATE operation, decided by a closed predicate, inspected after creation, never an anchor for a file that does not exist (sensei#312)'
    status: accepted
    architectural_plane: intended
    rationale: Implement prospective authority for new surfaces from sensei#312 under the supplied plan.
    context: 'decision_authority: architectural; certified_by: github.com/globulario/sensei-code @ fac399f8225f; decided_by: supplied plan sha256 4e4165005627fb7847d0b165b50b81cad5774ef10c8d8c32663b3fe291b6b2f7 (not architect-produced); human_authorization: none established: submitted unattended with an externally supplied plan; no human presence was established'
    consequences: 'A responsible plan that needs a new regression test beside a covered file can earn coverage for that file without any anchor pretending the file was observed. Every other new file is exactly as uncovered as today. After this lands the confinement-v2 natural task can reach the candidate boundary, which is what the #89 Series B reproducer needs.'
    related_invariants:
      - sensei_code.workflow.context_never_widens_worker_scope
      - sensei_code.workflow.execution_is_authorized_once_at_run
    source_files:
      - internal/event/event.go
      - internal/session/store.go
      - internal/workflow/derivedcoverage_live_test.go
      - internal/workflow/engine.go
      - internal/workflow/engine_test.go
      - internal/workflow/prospective.go
      - internal/workflow/prospective_test.go
      - internal/workflow/suppliedplan.go
  - id: decision.sensei_code.stop_merging_git_s_stderr_into_values_used_as_object_ids_in
    title: Stop merging git's stderr into values used as object ids in the snapshot projection.
    status: accepted
    architectural_plane: intended
    rationale: 'In internal/ghbridge/snapshot.go, stop merging git''s stderr into values used as object ids: read stdout for the id and keep stderr for the error text, so a git warning cannot make VerifySnapshot claim the candidate tree does not match.'
    context: 'decision_authority: architectural; certified_by: github.com/globulario/sensei-code @ fd350489a19394be847d770f2e8dd7b8f1b75303; decided_by: supplied plan sha256 79dd3356e4e24de8780308966f2f115e3230f28d6b8cb72cc0eec897d6578920 (not architect-produced); human_authorization: none established: submitted unattended with an externally supplied plan; no human presence was established'
    consequences: A git warning during snapshot publication or verification now produces either a correct id or an explicit failure carrying git's own text, instead of a false claim that the candidate tree or parent does not match. No change to what is accepted or refused.
    related_invariants:
      - sensei_code.ghbridge.a_published_snapshot_is_a_verified_projection
    source_files:
      - internal/ghbridge/runner_test.go
      - internal/ghbridge/snapshot.go
  - id: decision.sensei_code.make_architect_retry_feedback_distinguish_an_absent_response
    title: Make architect retry feedback distinguish an absent response from malformed bounded JSON.
    status: accepted
    architectural_plane: intended
    rationale: 'In internal/workflow/engine.go, stop telling the architect that its previous response was not valid bounded JSON when no response was received at all: distinguish an absent answer from a malformed one on the retry path, so a retry after a timeout does not accuse the architect of output it never produced.'
    context: 'decision_authority: architectural; certified_by: github.com/globulario/sensei-code @ 739133dcea2b43a8a070318357d701d55d2ce43b; decided_by: ChatGPT; human_authorization: none established: submitted unattended; no human presence was established'
    consequences: Retries after an absent architect turn no longer claim the architect emitted invalid JSON; malformed responses still receive corrective JSON guidance. No absence is treated as an answer, and authority behavior remains fail closed.
    related_invariants:
      - sensei_code.authority.only_an_explicit_answer_satisfies_a_boundary
    source_files:
      - internal/workflow/architect_retry_test.go
      - internal/workflow/engine.go
  - id: decision.sensei_code.implement_objective_70b2a1_at_the_durable_store_boundary_wit
    title: "Implement OBJECTIVE 70B2a1 at the durable Store boundary within the verified 47-file envelope, using the preserved candidate only as implementation material and excluding all 70B2a2 history-filtering and restoration semantics."
    status: accepted
    architectural_plane: intended
    rationale: |-
      Law (OBJECTIVE 70B2a1, DF-41B2a1, RULING-188): A fresh resumed process receives a fresh SessionID, but may append governed continuation state to the existing task ledger only after one canonical durable session-lineage transition has established it as the current session for that task. Session authority is enforced at the durable append/history boundary. A caller-level Resume gate is not sufficient authority.
      70B2a1 owns: fresh SessionID generation; physical holder-Store identity; canonical session-lineage record representation; lineage root/tip validation; serialized lineage transition; authorization of durable appends by SessionID; canonical classification of historical events as lineage-member or foreign; bounded record-lock lifecycle required to serialize those operations; propagation of durable append failure to the caller.
      70B2a1 does not own: CLI lane selection; TUI resume behavior; authority-answer continuation policy; PlanAttempt/grant restoration semantics; checkpoint replay; incomplete-obligation reconstruction; DF-30 episode reconstruction (resume/discovery consumers are 70B2a2).
      Full objective text: frozen objective sha256 badbe98e47a37aaa5a6dc9c03360805eaf1a5b22326849fae1ccf8966b8a3c81 (run 70B2a1-r15), preserved verbatim in the engine's pending record for task-1791479744199622016 and the operator archive.
    context: "decision_authority: architectural; certified_by: github.com/globulario/sensei-code @ 05feaf64d2694e97ac42b6bb93fbb49b9851a1f1; decided_by: ChatGPT; human_authorization: none established: submitted unattended; no human presence was established"
    consequences: "One physical ledger can contain successive resumed sessions only through a canonical lineage chain. Foreign, stale, unbound, competing, malformed, rootless, and mismatched-holder writes fail closed. Pre-binding Resume failures complete through a typed control result while leaving durable history unchanged. After binding, durable failures propagate to the originating invocation and cannot appear on the event bus as successful events. Existing authority, review, candidate, non-convergence, and checkpoint ownership contracts remain intact. CLI/TUI history filtering, checkpoint replay, and authority, plan, grant, gap, or DF-30 restoration remain deferred."
    related_invariants:
      - sensei_code.attestation.an_override_binds_to_a_canonical_review_not_a_receipt
      - sensei_code.authority.only_an_explicit_answer_satisfies_a_boundary
      - sensei_code.candidate.disposition_is_decided_and_evidence_outlives_removal
      - sensei_code.derived.future_only_a_question_cannot_authorize_the_run_that_wrote_it
      - sensei_code.resume.never_skips_a_human_decision
      - sensei_code.reviewartifact.the_request_carries_the_response_contract
      - sensei_code.reviewobligation.a_waiter_is_disposable_the_obligation_is_not
      - sensei_code.reviewobservation.evidence_is_never_silence
      - sensei_code.workflow.context_never_widens_worker_scope
      - sensei_code.workflow.execution_is_authorized_once_at_run
      - sensei_code.workflow.non_convergence_is_owed_an_architect_replan
      - sensei_code.workflow.provider_unavailability_blocks_the_turn_not_the_task
      - sensei_code.workflow.repeated_resume_cannot_mint_authority
      - sensei_code.workflow.unexamined_planned_file_is_not_covered_by_its_neighbour
