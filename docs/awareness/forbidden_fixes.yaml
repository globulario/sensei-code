forbidden_fixes:
  - id: forbidden_fix.sensei_code.derive_observation_presence_from_transport_success
    title: Derive observation presence from transport success
    summary: Treating a returned-without-error Sensei call as Present. Presence must be decided by inspecting the returned evidence; a call that succeeds at the transport layer but carries neither text nor structured content is Absent and must fail the build of any packet that requires it.
    protects:
      files:
        - internal/assist/packet.go
    related_invariants:
      - sensei_code.assisted_context.source_is_sensei
    reason: Treating a returned-without-error Sensei call as Present. Presence must be decided by inspecting the returned evidence; a call that succeeds at the transport layer but carries neither text nor structured content is Absent and must fail the build of any packet that requires it.
  - id: forbidden_fix.sensei_code.report_a_provider_state_change_from_the_acknowledgement_of_t
    title: Report a provider state change from the acknowledgement of the call that requested it
    summary: Treating a successful account/logout or a login-completed notification as proof that the account state changed. The provider acknowledges before it settles. Confirm the resulting state by reading it back from the owner within a bounded wait, and report what was actually observed.
    protects:
      files:
        - internal/provider/codex_appserver.go
    related_invariants:
      - sensei_code.provider.unknown_auth_is_not_connected
    reason: Treating a successful account/logout or a login-completed notification as proof that the account state changed. The provider acknowledges before it settles. Confirm the resulting state by reading it back from the owner within a bounded wait, and report what was actually observed.
  - id: sensei_code.give_an_adversarial_role_the_architects_thread_for_context
    title: Fork the architect's thread into a reviewer or hunter so it has context
    summary: 'It reads as an improvement: the reviewer understands the change better, its findings are more relevant, and the review looks stronger. What it actually does is remove the independence that made the verdict worth recording, and it does so invisibly — the reviewer still returns findings, still sometimes refuses, and nothing in the transcript says it was reading the author''s argument. Governing facts and the artifact go in the packet; the conversation that argued for the change does not. The same applies to giving a reviewer the worker''s reasoning, and to letting a caller set the session mode on an adversarial request.'
    protects:
      files:
        - internal/agent/agent.go
    related_invariants:
      - sensei_code.roles.adversarial_roles_inherit_nothing_and_bind_to_a_revision
    reason: an independent review is independent of the session, the author, and the revision it did not read
    contract: an independent review is independent of the session, the author, and the revision it did not read
  - id: forbidden_fix.sensei_code.reconstruct_an_upstream_transport_classification
    title: Reconstruct a transport classification the upstream surface has already erased
    summary: 'Rebuilding the difference between an unreachable backend and an expired client deadline inside this repository, by parsing the prose Sensei returned or by re-classifying in the adapter. awareness-mcp''s toolRPCError (globulario/sensei cmd/awareness-mcp/main.go:1038-1043) tests for BOTH codes.Unavailable and codes.DeadlineExceeded and then emits one sentence asserting the backend is unreachable, so by the time the text crosses this boundary the distinction is GONE. Anything reconstructed from it here is inferred, not observed. Client.call sets no deadline (it is a blocking frame read) and routePlan passes no per-call context, so this repository neither creates the deadline nor owns the classification -- it cannot recover what the owning surface discarded. Until Sensei publishes the distinction structurally (tracked as globulario/sensei#319), report what was received and treat the outcome as UNKNOWN rather than as absence. Unknown is less informative and more truthful. The most direct place this would be written is internal/sensei/health.go, where backendReason already reads err.Error() looking for the phrase ''backend is unreachable'' -- but it QUOTES what it finds and attributes it as quoted from Sensei rather than deciding from it, which is the correct side of the line. Quoting an upstream statement is reporting; deciding from it is reconstruction. The whole internal/sensei/ boundary is protected because the prohibition is about the adapter, not about whichever function sits nearest the temptation today.'
    protects:
      files:
        - internal/sensei/
        - internal/sensei/mcp.go
        - internal/sensei/health.go
    related_invariants:
      - sensei_code.sensei_boundary.refusal_carries_its_reason
    reason: 'Rebuilding the difference between an unreachable backend and an expired client deadline inside this repository, by parsing the prose Sensei returned or by re-classifying in the adapter. awareness-mcp''s toolRPCError (globulario/sensei cmd/awareness-mcp/main.go:1038-1043) tests for BOTH codes.Unavailable and codes.DeadlineExceeded and then emits one sentence asserting the backend is unreachable, so by the time the text crosses this boundary the distinction is GONE. Anything reconstructed from it here is inferred, not observed. Client.call sets no deadline (it is a blocking frame read) and routePlan passes no per-call context, so this repository neither creates the deadline nor owns the classification -- it cannot recover what the owning surface discarded. Until Sensei publishes the distinction structurally (tracked as globulario/sensei#319), report what was received and treat the outcome as UNKNOWN rather than as absence. Unknown is less informative and more truthful. The most direct place this would be written is internal/sensei/health.go, where backendReason already reads err.Error() looking for the phrase ''backend is unreachable'' -- but it QUOTES what it finds and attributes it as quoted from Sensei rather than deciding from it, which is the correct side of the line. Quoting an upstream statement is reporting; deciding from it is reconstruction. The whole internal/sensei/ boundary is protected because the prohibition is about the adapter, not about whichever function sits nearest the temptation today.'
  - id: forbidden_fix.sensei_code.ghwebhook.give_the_ingress_an_engine_handle
    title: Give the webhook ingress a workflow, control or agent handle so it can act on a delivery
    summary: 'It reads as plumbing: the delivery already arrived and something downstream obviously wants to know, so the package acquires an engine, resolver, runner or control handle just to notify it. What that actually does is erase the distinction the whole package exists to hold. A signature over bytes becomes permission to act on their content, and it does so invisibly, because notifying and authorizing look identical at the call site. The Sink interface is deliberately the entire surface between transport and everything else, so what a delivery can cause stays bounded by what that interface can express. Widening Sink, or importing a governed capability in order to reach past it, is the same move wearing two hats. boundary_test.go pins the import boundary rather than leaving it to discipline, precisely because this edit will look reasonable to whoever makes it.'
    protects:
      files:
        - internal/ghwebhook/
        - internal/ghwebhook/sink.go
    related_invariants:
      - sensei_code.ghwebhook.signature_authenticates_delivery_not_authority
    reason: 'It reads as plumbing: the delivery already arrived and something downstream obviously wants to know, so the package acquires an engine, resolver, runner or control handle just to notify it. What that actually does is erase the distinction the whole package exists to hold. A signature over bytes becomes permission to act on their content, and it does so invisibly, because notifying and authorizing look identical at the call site. The Sink interface is deliberately the entire surface between transport and everything else, so what a delivery can cause stays bounded by what that interface can express. Widening Sink, or importing a governed capability in order to reach past it, is the same move wearing two hats. boundary_test.go pins the import boundary rather than leaving it to discipline, precisely because this edit will look reasonable to whoever makes it.'
  - id: forbidden_fix.sensei_code.ghwebhook.verify_a_reencoding_of_the_payload
    title: Parse the payload first and verify the MAC over a re-encoding of it
    summary: 'Unmarshalling before verification is tempting because the handler wants the typed payload anyway, and re-marshalling for the MAC looks equivalent. It is not. Key order, escaping and unicode normalization all survive a JSON round trip, and a MAC does not forgive any of them: the verifier would authenticate a document GitHub never sent while refusing ones it did. The same prohibition covers reading the algorithm out of the signature header, which would let the party being authenticated choose how it is authenticated, and accepting the legacy sha1 header alongside sha256, which would let an attacker who can forge SHA-1 pick which header is read. Verify over exactly the bytes that arrived, before anything interprets them.'
    protects:
      files:
        - internal/ghwebhook/verify.go
        - internal/ghwebhook/server.go
    related_invariants:
      - sensei_code.ghwebhook.signature_precedes_every_interpretation
    reason: 'Unmarshalling before verification is tempting because the handler wants the typed payload anyway, and re-marshalling for the MAC looks equivalent. It is not. Key order, escaping and unicode normalization all survive a JSON round trip, and a MAC does not forgive any of them: the verifier would authenticate a document GitHub never sent while refusing ones it did. The same prohibition covers reading the algorithm out of the signature header, which would let the party being authenticated choose how it is authenticated, and accepting the legacy sha1 header alongside sha256, which would let an attacker who can forge SHA-1 pick which header is read. Verify over exactly the bytes that arrived, before anything interprets them.'
  - id: forbidden_fix.sensei_code.proposal.treat_a_github_identity_as_objective_authority
    title: Treat a verified signature, sender login or sender id as authorization for the objective it carries
    summary: 'The shape is an allowlist: the delivery is signed, the sender id is the operator''s own GitHub account, so the proposal is auto-approved and a task is created. Every step is individually true and the conclusion is still false. A GitHub signature authenticates delivery bytes; it says nothing about who composed them, and account compromise, a token in CI, or anyone with write access to the repository all produce a delivery that passes exactly this check. Local operator provenance is established by the existing objective socket and its kernel-observed peer checks on a real terminal, and that is a different fact from any property GitHub can assert. A proposal is inert data until a local operator selects that exact comment id through that socket.'
    protects:
      files:
        - internal/ghwebhook/proposal.go
        - internal/ghwebhook/sink.go
        - cmd/sensei-code/proposal.go
    related_invariants:
      - sensei_code.proposal.inert_until_a_local_operator_approves_it
    reason: 'The shape is an allowlist: the delivery is signed, the sender id is the operator''s own GitHub account, so the proposal is auto-approved and a task is created. Every step is individually true and the conclusion is still false. A GitHub signature authenticates delivery bytes; it says nothing about who composed them, and account compromise, a token in CI, or anyone with write access to the repository all produce a delivery that passes exactly this check. Local operator provenance is established by the existing objective socket and its kernel-observed peer checks on a real terminal, and that is a different fact from any property GitHub can assert. A proposal is inert data until a local operator selects that exact comment id through that socket.'
  - id: forbidden_fix.sensei_code.proposal.write_the_approval_receipt_after_the_side_effect
    title: Write the approval receipt after submitting the objective, so a failed submission does not burn the attempt
    summary: 'It looks like a fix for a real annoyance: an approval that failed for a transient reason has spent its one attempt, and the operator has to intervene. Reordering so the receipt is written only after a confirmed submission removes that friction and, with it, the only protection against a duplicate task. The dangerous window is not the failed submission but the uncertain one -- the process dies after the task was accepted and before anything durable recorded it. With the receipt written first that state is attempting, and a second approval is refused. With the receipt written last it is indistinguishable from never having tried, and the retry creates the task twice. Fail closed: an uncertain approval stays spent, and recovery is an explicit operator act rather than an automatic retry.'
    protects:
      files:
        - internal/ghwebhook/proposal.go
        - cmd/sensei-code/proposal.go
    related_invariants:
      - sensei_code.proposal.approval_is_durable_and_at_most_once
    reason: 'It looks like a fix for a real annoyance: an approval that failed for a transient reason has spent its one attempt, and the operator has to intervene. Reordering so the receipt is written only after a confirmed submission removes that friction and, with it, the only protection against a duplicate task. The dangerous window is not the failed submission but the uncertain one -- the process dies after the task was accepted and before anything durable recorded it. With the receipt written first that state is attempting, and a second approval is refused. With the receipt written last it is indistinguishable from never having tried, and the retry creates the task twice. Fail closed: an uncertain approval stays spent, and recovery is an explicit operator act rather than an automatic retry.'
  - id: forbidden_fix.sensei_code.ghbridge.fall_back_to_the_local_agent_when_the_bridge_is_unavailable
    title: Fall back to the local CLI provider when the GitHub bridge cannot serve a turn
    summary: 'It reads as resilience: the remote party is unreachable or the binding is missing, so rather than stopping the task the resolver hands the turn to the local agent that would otherwise have served it. The task then completes, the events look ordinary, and the record attributes a plan or a review to a party that did not write it, with nothing anywhere to show the substitution. A delegated architect quietly becomes the local one; an independent review quietly becomes a self-review. The same shape appears in the App transport as falling back to the operator''s personal gh credentials when the App is misconfigured, which silently changes which principal acted. Refuse and let the refusal propagate. The engine may still choose an alternative through its own assignment ladder, and the difference that matters is that it records having done so.'
    protects:
      files:
        - internal/ghbridge/resolver.go
        - internal/ghbridge/apiclient.go
    related_invariants:
      - sensei_code.ghbridge.an_unavailable_bridge_refuses_rather_than_substituting
    reason: 'It reads as resilience: the remote party is unreachable or the binding is missing, so rather than stopping the task the resolver hands the turn to the local agent that would otherwise have served it. The task then completes, the events look ordinary, and the record attributes a plan or a review to a party that did not write it, with nothing anywhere to show the substitution. A delegated architect quietly becomes the local one; an independent review quietly becomes a self-review. The same shape appears in the App transport as falling back to the operator''s personal gh credentials when the App is misconfigured, which silently changes which principal acted. Refuse and let the refusal propagate. The engine may still choose an alternative through its own assignment ladder, and the difference that matters is that it records having done so.'
  - id: forbidden_fix.sensei_code.ghbridge.rebuild_the_review_snapshot_from_the_worktree
    title: Rebuild the review snapshot from the worktree with git add instead of the bound candidate tree
    summary: 'Staging the worktree and committing is the familiar way to make a commit, and it appears to produce the same thing. It produces a new observation instead of a projection. If the worktree moved at all since the candidate was captured -- a stray build artifact, a concurrent edit, a partially applied repair -- the reviewer is shown an artifact that exists nowhere in the task''s history, and the verdict returned is about something the workflow never bound to. Build the commit from the captured tree with commit-tree, then read the resulting tree and parent back out and compare them against the binding: commit-tree accepts any tree it is handed, so that read-back is the only thing that makes the commit a projection rather than a coincidence. Skipping the verification because commit-tree was just given the right tree is the same forbidden fix in its smaller form.'
    protects:
      files:
        - internal/ghbridge/snapshot.go
    related_invariants:
      - sensei_code.ghbridge.a_published_snapshot_is_a_verified_projection
    reason: 'Staging the worktree and committing is the familiar way to make a commit, and it appears to produce the same thing. It produces a new observation instead of a projection. If the worktree moved at all since the candidate was captured -- a stray build artifact, a concurrent edit, a partially applied repair -- the reviewer is shown an artifact that exists nowhere in the task''s history, and the verdict returned is about something the workflow never bound to. Build the commit from the captured tree with commit-tree, then read the resulting tree and parent back out and compare them against the binding: commit-tree accepts any tree it is handed, so that read-back is the only thing that makes the commit a projection rather than a coincidence. Skipping the verification because commit-tree was just given the right tree is the same forbidden fix in its smaller form.'
  - id: forbidden_fix.sensei_code.change_only_the_displayed_address_so_the_label_matches_what
    title: Change only the displayed address so the label matches what was queried
    summary: 'Replacing ''answering on <configured address>'' with ''answering on localhost:10120'' makes the message truthful and leaves the defect intact: the check still observes whatever serves the CLI default port, still certifies a graph this repository never selected, and now says so in a way that reads as correct. The label was never the defect. The scope the check accepted must reach the observation it issues -- pass -addr, do not restate the wrong one.'
    protects:
      files:
        - internal/setup/checks.go
    reason: A check that accepts a scope must issue its observation within that scope, and must not label an answer with a scope it did not ask.
    contract: A check that accepts a scope must issue its observation within that scope, and must not label an answer with a scope it did not ask.
