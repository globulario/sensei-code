id: sensei_code.human_owns_publication
level: contract
title: Sensei Code may propose and publish a change; landing it is the human's decision
intent: |
  Typing /run authorizes Sensei Code to undertake that task within its configured capabilities
  and authority boundaries. The bounded plan is shown as information, never as a second gate:
  the architect settles ordinary architectural questions alone, and only the authority router
  may interrupt the human again.
  Publication is the exception, and it is a different decision. Sensei Code may open a pull
  request. It never merges one, and a pull request is never an admission. Publication is gated
  twice: the configuration must grant the capability, and the human must approve the specific
  change. A standing capability is not consent for a particular act, and authorizing a task is
  not authorizing its publication.
agent_guidance: |
  Do not add a path that reaches the repository's shared history without a human decision in
  front of it. If a capability is declared but not enforced, either enforce it or state plainly
  that it is an instruction rather than a boundary.
bad_smells:
  - a merge, push or deploy performed without an explicit human decision
  - a capability flag that reads as a guarantee while only appearing in a prompt
  - reviewer acceptance described as admission
  - a mandatory step that interrupts the human without producing an authority decision
activation_triggers:
  - merge
  - push
  - publish
  - pull request
  - approval
status: active
