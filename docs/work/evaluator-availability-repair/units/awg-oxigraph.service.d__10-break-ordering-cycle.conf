# Removes the ordering cycle that deletes awg-awareness-graph's start job at
# every boot:
#   default.target -> awg-awareness-graph -> awg-oxigraph -> default.target
#
# awg-oxigraph.service carries BOTH "After=default.target" and
# "WantedBy=default.target". A unit pulled in by default.target must not also
# be ordered after it. An empty assignment resets the list, so this drop-in
# removes the ordering without editing the shipped unit and is reverted by
# deleting this file.
#
# Install as:
#   ~/.config/systemd/user/awg-oxigraph.service.d/10-break-ordering-cycle.conf
[Unit]
After=
