decisions: []
  - id: decision.sensei_code.add_a_read_only_tui_readiness_report_command_keep_all_repair
    title: Add a read-only TUI readiness report command; keep all repair/apply behavior exclusive to the existing CLI setup flow.
    status: accepted
    architectural_plane: intended
    rationale: add a /setup command to the TUI that runs the readiness checks in internal/setup and renders the report read-only, registered in internal/command like the other commands; do not add an apply path, the CLI already has one
    context: Accepted by the human in an interactive Sensei Code session.
    consequences: TUI users can inspect machine and repository readiness without leaving the session; repairs remain available only through `sensei-code setup --apply`.
    related_invariants:
      - sensei_code.provider.credentials_remain_provider_owned
      - sensei_code.command.unknown_input_is_never_run_as_a_task
    source_files:
      - README.md
      - cmd/sensei-code/setup.go
      - internal/command/command.go
      - internal/command/command_test.go
      - internal/setup/inspect.go
      - internal/setup/inspect_test.go
      - internal/setup/setup.go
      - internal/setup/setup_test.go
      - internal/tui/model.go
      - internal/tui/setup_command_test.go
